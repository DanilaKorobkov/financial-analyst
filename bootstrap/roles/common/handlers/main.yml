# =============================================================================
# roles/common/handlers/main.yml — handlers роли common (пока пустой).
# =============================================================================
#
# ЧТО ТАКОЕ HANDLERS.
# В Ansible handlers — это «отложенные задачи, запускаемые по уведомлению».
# Типичный паттерн: task правит конфиг сервиса (например, /etc/nginx/nginx.conf)
# и в случае реального изменения уведомляет handler через `notify: restart nginx`.
# Handler сработает один раз в конце прогона, даже если несколько task'ов
# его уведомили. Это правильное место для restart/reload демонов.
#
# ПОЧЕМУ У НАС ОН ПУСТОЙ.
# Роль common не правит конфигурацию сервисов:
# - apt-пакеты Ansible ставит идемпотентно через модуль apt;
# - timezone выставляется через community.general.timezone, который сам
#   управляет systemctl restart systemd-timedated;
# - sshd мы НЕ правим, а только assert'им (см. tasks/main.yml) — поэтому
#   `restart sshd` не нужен.
# Файл оставлен как точка расширения: если позже появится drop-in для sshd
# или своя настройка systemd-unit'а — handler ляжет сюда (handlers/main.yml
# обязателен по конвенции, даже если пустой).
#
# КАК СВЯЗАН С ДРУГИМИ ФАЙЛАМИ.
# - На handlers ссылается tasks/main.yml через `notify: <имя_handler'а>`
#   (сейчас никто не ссылается).
