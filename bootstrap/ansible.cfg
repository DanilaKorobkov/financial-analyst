[defaults]
# Все относительные пути в этом каталоге считаются от bootstrap/.
# В Taskfile корня все bootstrap-задачи объявлены с `dir: bootstrap`,
# поэтому достаточно относительных путей.
inventory = inventory/hosts.yml
# Сначала ищем роли в bootstrap/roles/ (наши), потом в .galaxy/ (внешние,
# поставленные ansible-galaxy через task bootstrap:deps). Каталог .galaxy/
# в .gitignore — это сборочный артефакт, в репо его не держим.
roles_path = roles:.galaxy
# Куда ansible-galaxy ставит collections (см. task bootstrap:deps) и откуда
# их подхватывает playbook. Каталог в .gitignore — собираем при каждом запуске
# CI / при первом локальном `task bootstrap:deps`.
collections_path = .galaxy/collections
# В CI ansible-vault не используется, секреты живут в GitHub Actions Secrets
# и доставляются в Dokploy через его API (см. README.md, раздел «Секреты»).
# Соответственно playbook ничего не расшифровывает на лету.
host_key_checking = True
retry_files_enabled = False
nocows = True
stdout_callback = yaml
interpreter_python = auto_silent
# Bootstrap-playbook работает с системными вещами (apt, sshd, swap, docker) —
# вся работа через become. Подсказываем sudoers по умолчанию.
become_method = sudo
