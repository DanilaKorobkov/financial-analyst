# =============================================================================
# ansible.cfg — конфигурация Ansible для bootstrap-каркаса.
# =============================================================================
#
# ЧТО ЭТО.
# Файл, который Ansible читает при запуске и из которого узнаёт: где брать
# inventory, где искать роли и коллекции, какой формат вывода использовать,
# как именно повышать привилегии и т.д. Ansible ищет ansible.cfg в порядке:
# 1) переменная окружения ANSIBLE_CONFIG; 2) ./ansible.cfg в cwd; 3) ~/.ansible.cfg;
# 4) /etc/ansible/ansible.cfg. У нас [task bootstrap:*] делает `cd bootstrap/`,
# поэтому пункт (2) срабатывает на этот файл.
#
# КАК СВЯЗАН С ДРУГИМИ ФАЙЛАМИ.
# - inventory       → inventory/hosts.yml (определяет хосты, к которым ходить).
# - roles_path      → roles/ (наша роль common) и .galaxy/ (скачанные через
#                     ansible-galaxy внешние роли из requirements.yml).
# - collections_path → .galaxy/collections (модули community.general, ansible.posix
#                     из requirements.yml).
# - запускают этот конфиг задачи из ../Taskfile.yml (bootstrap:lint, :syntax-check,
#   :check, :run, :smoke) — все с `dir: bootstrap`, чтобы относительные пути
#   ниже работали.

[defaults]

# Какой inventory читать по умолчанию. Можно перебить через CLI `-i <путь>`,
# но в Taskfile мы этого не делаем. Реальные параметры хостов (IP, user, ключ)
# лежат в host_vars/<host>.yml — см. inventory/host_vars/prod-vps.yml.example.
inventory = inventory/hosts.yml

# Где искать роли при загрузке playbook'а.
# - roles/   — наши собственные роли (сейчас единственная — common).
# - .galaxy/ — сюда `ansible-galaxy role install -r requirements.yml` ставит
#              внешние роли (geerlingguy.swap, geerlingguy.docker).
# Ansible ищет в этом порядке: сначала локальные, потом внешние. Если когда-то
# заведём свою роль с именем, совпадающим с внешней — приоритет у нашей.
roles_path = roles:.galaxy

# Где искать collections (пакеты модулей вида community.general.timezone).
# Эти модули НЕ входят в ansible-core по умолчанию, их тянем отдельно через
# `ansible-galaxy collection install -r requirements.yml`.
collections_path = .galaxy/collections

# Проверять fingerprint SSH-хоста при первом подключении (`True` = да).
# Защита от MITM. Для первого прогона на свежем VPS придётся либо принять
# fingerprint вручную, либо заранее добавить его в ~/.ssh/known_hosts.
host_key_checking = True

# Не создавать *.retry-файлы при падении playbook'а. Они не нужны
# (рестарт прогоняется заново, не с середины) и мусорят рабочий каталог.
retry_files_enabled = False

# Отключить ASCII-«коровку» (cowsay) в выводе. Косметика: чисто, читаемо.
nocows = True

# Формат вывода прогона. `yaml` гораздо читаемее дефолтного `default`:
# многострочные diff'ы и команды видны как обычный текст, а не как одна
# строка с экранированными переносами.
stdout_callback = yaml

# Bootstrap-playbook работает с системными вещами (apt, sshd, swap, docker) —
# вся работа через become (повышение привилегий до root). Указываем sudo
# как метод (есть ещё su, doas, pbrun — нам не нужны).
become_method = sudo
