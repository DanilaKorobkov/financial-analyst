---
# =============================================================================
# inventory/hosts.yml — список целевых хостов (inventory).
# =============================================================================
#
# ЧТО ЭТО.
# В Ansible inventory отвечает на вопрос «к каким серверам подключаться?».
# Хосты группируются (group hierarchy), playbook потом обращается к группе:
# `hosts: prod` в playbooks/bootstrap.yml = «выполнить на всех хостах из
# группы prod».
#
# КАК СВЯЗАН С ДРУГИМИ ФАЙЛАМИ.
# - playbooks/bootstrap.yml ссылается на группу `prod` через `hosts: prod`.
# - inventory/host_vars/<host>.yml хранит параметры конкретного хоста
#   (IP, ansible_user, ssh-ключ). У нас — host_vars/prod-vps.yml.example
#   как шаблон.
# - inventory/group_vars/all.yml хранит переменные, общие для всех хостов
#   inventory (читается, потому что `all` — корневая группа).
# - ansible.cfg делает этот файл inventory'ем по умолчанию.

# Корневая группа `all` присутствует автоматически. Под ней мы создаём
# группу `prod` (production-окружение). Сейчас в ней один хост `prod-vps`;
# когда появится staging, добавится `staging-vps` рядом, а в children/
# можно будет завести группу `staging`.
all:
  children:
    prod:
      hosts:
        # `prod-vps` — внутренний идентификатор, не DNS-имя. По нему Ansible
        # ищет файл inventory/host_vars/prod-vps.yml и берёт оттуда
        # реальные параметры подключения (ansible_host, ansible_user,
        # ansible_ssh_private_key_file). Пустой словарь `{}` обязателен —
        # YAML-синтаксис: хост без inline-переменных.
        prod-vps: {}
