---
# =============================================================================
# inventory/group_vars/all.yml — переменные, общие для всех хостов inventory.
# =============================================================================
#
# ЧТО ЭТО.
# Ansible автоматически читает inventory/group_vars/<group>.yml для каждой
# группы хостов из hosts.yml. Имя файла = имя группы. `all` — встроенная
# корневая группа, в которую попадают вообще все хосты, поэтому переменные
# здесь видны везде. Это правильное место для параметров, которые не зависят
# от конкретного хоста.
#
# КАК СВЯЗАН С ДРУГИМИ ФАЙЛАМИ.
# - Переменные ниже читают сторонние роли из requirements.yml:
#   swap_* — роль geerlingguy.swap; docker_* — роль geerlingguy.docker.
#   Имена переменных диктуют сами роли (мы их не выбираем).
# - playbooks/bootstrap.yml подключает эти роли — там переменные применяются.
# - Если в host_vars/<host>.yml задать ту же переменную, она перебьёт значение
#   отсюда (host_vars приоритетнее group_vars).

# ─── geerlingguy.swap ───────────────────────────────────────────────────────
# Размер swap-файла в мегабайтах. 2 ГБ — щадящий запас для VPS с 4 ГБ RAM:
# хватит на короткие пики потребления (apt upgrade, docker build), без риска
# съесть весь диск.
swap_file_size_mb: '2048'

# vm.swappiness — насколько активно ядро готово выгружать страницы в swap.
# 0   = только при OOM;
# 10  = почти не своппит при нормальной нагрузке (рекомендуется для серверов);
# 60  = default Linux (агрессивно своппит, плохо для БД и Docker'а);
# 100 = почти всегда своп.
swap_swappiness: '10'

# ─── geerlingguy.docker ─────────────────────────────────────────────────────
# Ставить ли compose v2 как плагин (`docker compose ...`, не `docker-compose`).
# Dokploy и наш сервис (через docker-compose из Dokploy UI) используют именно
# плагин v2 — без него Dokploy installer падает.
docker_install_compose_plugin: true
