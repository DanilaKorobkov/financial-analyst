version: '3'

# Корневой Taskfile репозитория. Делится на две части:
#   1. Общерепные linters/formatters (yamllint, markdownlint, prettier, lychee,
#      cspell, actionlint) — работают по всему репо, включая `.github/`,
#      `.claude/`, корневые `*.md`.
#   2. Делегация в server/Taskfile.yml через `includes`. Go-задачи модуля
#      сервера зовутся `task server:<name>` (например `task server:test`).
#
# При появлении web/ рядом с server/ сюда добавится `web: ./web` и
# симметричный набор алиасов `task web:<name>`.

includes:
  # `dir` обязателен: без него Go-инструменты (go-arch-lint, buf, mockery)
  # запускаются из корня репо и ищут свои конфиги (`.go-arch-lint.yml`,
  # `buf.yaml`) там, где их нет. С `dir: ./server` все задачи модуля
  # выполняются с cwd=server/.
  server:
    taskfile: ./server
    dir: ./server
  # web/ — Vite + React фронт. Команды зовутся как `task web:<name>` и
  # выполняются с cwd=web/, чтобы npm видел package.json.
  web:
    taskfile: ./web
    dir: ./web

tasks:
  checks:
    desc: Read-only проверки всего репо (server:checks + repo-checks).
    deps:
      - task: server:checks
      - task: repo-checks

  repo-checks:
    desc: Общерепные linters + hadolint + сборка Docker-образов.
    # Параллельный аналог `server:checks` для не-модульного слоя репо.
    # Тот же набор зеркалит матрица `.github/workflows/repo-checks.yml`.
    #
    # bootstrap:* НЕ кладём в deps — ansible-lint/ansible-playbook падают с
    # «Ansible requires blocking IO on stdin/stdout/stderr» при параллельном
    # запуске через go-task (родительский shell ставит stderr в non-blocking).
    # Поэтому гоняем их в `cmds` после параллельных deps — последовательно,
    # с нормальным stderr. В CI каждая bootstrap-задача — отдельный job
    # матрицы, там этой проблемы нет.
    deps:
      - task: lint-yamllint
      - task: lint-markdownlint
      - task: lint-prettier
      - task: lint-lychee
      - task: lint-cspell
      - task: lint-actionlint
      - task: lint-hadolint
      - task: docker-build
    cmds:
      - task: bootstrap:lint
      - task: bootstrap:syntax-check

  lint-yamllint:
    desc: yamllint по всем YAML-файлам.
    cmds:
      - yamllint .

  lint-markdownlint:
    desc: markdownlint-cli2 — структура Markdown (заголовки, списки, code fences).
    # `**/*.md` — обычные пути; `**/.*/**/*.md` — dot-каталоги на ЛЮБОМ уровне
    # (`.claude/`, `foo/.bar/baz.md`, `.github/workflows/...`). `.git` режется
    # ignore-правилом в `.markdownlint-cli2.jsonc`.
    cmds:
      - markdownlint-cli2 "**/*.md" "**/.*/**/*.md"

  lint-prettier:
    desc: prettier --check — оформление Markdown (выравнивание GFM-таблиц, пробелы).
    # Парный к lint-markdownlint: markdownlint проверяет структуру, prettier — оформление.
    # Globs совпадают с lint-markdownlint; игнор-пути берутся из .gitignore автоматически.
    cmds:
      - prettier --check "**/*.md" "**/.*/**/*.md"

  lint-lychee:
    desc: lychee — проверка ссылок в Markdown (внешние URL, локальные пути, якоря).
    # Список файлов берём через `git ls-files --cached --others --exclude-standard`:
    # это даёт tracked + untracked файлы, уважая .gitignore. Так автоматически
    # исключается `web/node_modules/**/*.md` (сторонние README с битыми ссылками,
    # которые не наш код). Передавать bash-glob `**/*.md` нельзя — он подбирает
    # node_modules, а lychee `exclude_path` действует только при автообходе.
    cmds:
      - git ls-files --cached --others --exclude-standard "*.md" | xargs lychee --no-progress

  lint-cspell:
    desc: cspell — орфография ru/en во всём репозитории (Go, MD, YAML, TOML, ...).
    # NODE_PATH указывает на установку русского словаря через mise.
    # Без этого cspell не найдёт @cspell/dict-ru_ru, импортированный в cspell.config.yaml
    # (mise ставит каждый npm-пакет в свой изолированный prefix; см. подробнее
    # README или комментарий у `npm:@cspell/dict-ru_ru` в mise.toml).
    # `mise where` возвращает каталог установки — одинаково работает локально и в CI.
    env:
      NODE_PATH:
        sh: echo "$(mise where npm:@cspell/dict-ru_ru)/lib/node_modules"
    cmds:
      - cspell --no-progress --no-summary "**/*" "**/.*/**/*"

  lint-actionlint:
    desc: actionlint — статический анализ GitHub Actions workflows (.github/workflows/*.yml).
    # Без аргументов actionlint сам находит .github/workflows/*.yml; явный glob
    # не нужен и потенциально ломает обработку reusable workflows в подкаталогах.
    cmds:
      - actionlint

  lint-hadolint:
    desc: hadolint — best practices Docker + shellcheck в RUN.
    # Правила: https://github.com/hadolint/hadolint/wiki (DL3xxx/DL4xxx,
    # плюс SC2xxx из shellcheck). Запуск через Docker, а не mise: у
    # hadolint 2.12.0 нет darwin-arm64 бинарника, x86_64 падает под Rosetta.
    cmds:
      - >-
          docker run --rm -i
          -v "$PWD:/workspace:ro" -w /workspace
          ghcr.io/hadolint/hadolint:v2.12.0
          hadolint server/Dockerfile web/Dockerfile

  docker-build:
    desc: Собрать Docker-образы обоих сервисов (server + web) параллельно.
    # Сама сборка живёт внутри модулей: server:docker-build и web:docker-build —
    # каждый знает свой Dockerfile, контекст и тег. Тут только агрегатор,
    # симметричный другим композитным задачам корня (run, fmt, checks).
    # Артефакты — локальные теги fa-server:dev и fa-web:dev, в registry не пушим.
    deps:
      - task: server:docker-build
      - task: web:docker-build

  fmt:
    desc: Запустить все formatters (Go + Markdown).
    # Используем cmds (последовательно), а не deps (параллельно): fmt-markdownlint
    # и fmt-prettier работают по одним и тем же .md-файлам, и порядок важен —
    # сначала markdownlint правит структуру, затем Prettier нормализует
    # оформление поверх. server:fmt — Go-файлы, конфликта нет, но идёт первой
    # строкой для единообразия.
    cmds:
      - task: server:fmt
      - task: fmt-markdownlint
      - task: fmt-prettier

  fmt-markdownlint:
    desc: markdownlint-cli2 --fix — автофиксы структуры Markdown (стиль пайпов, маркеры списков).
    # Ошибки игнорируем: неисправляемые проблемы покажет lint-markdownlint в `task lint`.
    cmds:
      - markdownlint-cli2 --fix "**/*.md" "**/.*/**/*.md" || true

  fmt-prettier:
    desc: prettier --write — автофикс оформления Markdown (выравнивание таблиц, пробелы).
    cmds:
      - prettier --write "**/*.md" "**/.*/**/*.md"

  run:
    desc: Запустить все модули проекта параллельно (server, web).
    # deps в go-task запускаются параллельно — server и web поднимаются
    # одновременно. web перенаправляет /company.v1.* на server :8080.
    deps:
      - task: server:run
      - task: web:run

  # ──────────────────────────────────────────────────────────────────────────
  # bootstrap:* — Ansible-каркас для подготовки VPS под Dokploy.
  # Все задачи выполняются с cwd=bootstrap/, чтобы ansible.cfg и
  # относительные пути (inventory, roles_path, playbooks/) работали без
  # дополнительных флагов.
  # ──────────────────────────────────────────────────────────────────────────

  bootstrap:deps:
    desc: Ставит внешние Ansible-роли и коллекции из requirements.yml в bootstrap/.galaxy/.
    dir: bootstrap
    cmds:
      - ansible-galaxy role install -r requirements.yml --roles-path .galaxy
      - ansible-galaxy collection install -r requirements.yml --collections-path .galaxy/collections
    # Идемпотентность через status: если все роли и коллекции уже стоят —
    # задача skip. Каталоги создаются ansible-galaxy при первой установке.
    status:
      - test -d .galaxy/geerlingguy.swap
      - test -d .galaxy/geerlingguy.docker
      - test -d .galaxy/collections/ansible_collections/community/general
      - test -d .galaxy/collections/ansible_collections/ansible/posix

  bootstrap:lint:
    desc: ansible-lint — статический анализ Ansible-playbook'ов и ролей в bootstrap/.
    dir: bootstrap
    deps:
      - task: bootstrap:deps
    cmds:
      # Перечисляем входы явно: по дефолту ansible-lint ищет playbook'и в cwd, а
      # у нас playbook лежит в playbooks/. Конфиг — .ansible-lint в этом каталоге.
      - ansible-lint playbooks/ roles/ tests/

  bootstrap:syntax-check:
    desc: ansible-playbook --syntax-check — проверка синтаксиса bootstrap-playbook'а.
    dir: bootstrap
    deps:
      - task: bootstrap:deps
    cmds:
      - ansible-playbook --syntax-check playbooks/bootstrap.yml

  bootstrap:check:
    desc: Dry-run прогон bootstrap-playbook'а (без изменений на хосте).
    # Требует заполненный inventory/host_vars/<host>.yml. Подробнее — bootstrap/README.md.
    dir: bootstrap
    deps:
      - task: bootstrap:deps
    cmds:
      - ansible-playbook --check playbooks/bootstrap.yml

  bootstrap:run:
    desc: Реальный прогон bootstrap-playbook'а на целевом хосте (см. bootstrap/README.md).
    dir: bootstrap
    deps:
      - task: bootstrap:deps
    cmds:
      - ansible-playbook playbooks/bootstrap.yml

  bootstrap:smoke:
    desc: Прогон tests/smoke.yml — проверка состояния узла после bootstrap:run.
    dir: bootstrap
    deps:
      - task: bootstrap:deps
    cmds:
      - ansible-playbook tests/smoke.yml
