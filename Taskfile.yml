version: '3'

# Версии инструментов (go, golangci-lint, task) пинятся в `mise.toml`.
# mise сам подсовывает нужные бинари в PATH в этой директории.

tasks:
  lint:
    desc: >-
      Запустить все линтеры проекта параллельно (через `deps`),
      без fail-fast — увидим все провалы за один прогон.
      Агрегатор: при добавлении нового линтера расширяем `deps`
      через `task: lint-<инструмент>`.
    deps:
      - task: lint-golang
      - task: lint-yaml

  lint-golang:
    desc: Запустить golangci-lint по всему Go-коду проекта.
    cmds:
      - golangci-lint run ./...

  lint-yaml:
    desc: Запустить yamllint по всем YAML-файлам проекта.
    cmds:
      - yamllint .

  fmt:
    desc: >-
      Запустить все форматтеры проекта параллельно (через `deps`).
      Агрегатор: при добавлении нового форматтера расширяем `deps`
      через `task: fmt-<инструмент>`.
    deps:
      - task: fmt-golang

  fmt-golang:
    desc: >-
      Отформатировать Go-код через golangci-lint --fix.
      Ненулевой код выхода игнорируем (`|| true`), потому что задача —
      применить все доступные автофиксы, а оставшиеся неисправимые замечания
      должен показывать `task lint-golang`, а не ронять форматирование.
    cmds:
      - golangci-lint run --fix ./... || true

  checks:
    desc: >-
      Запустить все read-only проверки параллельно (`lint` + `compile`).
      `fmt` сюда не входит, потому что он мутирует файлы — его прогоняем отдельно.
      Агрегатор: при добавлении новой проверки расширяем `deps`.
    deps:
      - task: lint
      - task: compile

  compile:
    desc: >-
      Проверить, что все бинари из cmd/* компилируются.
      Агрегатор: каждый бинарь — отдельный таск `compile-<name>`,
      перечислен явно в `deps` (без авто-обнаружения), запускаются параллельно.
      Сборка идёт во временную директорию (`mktemp -d`), артефакты не сохраняем —
      цель только поймать ошибки компиляции.
      При добавлении нового cmd/<name> создаём новый таск `compile-<name>`
      и добавляем его в `deps` ниже и в matrix CI (`.github/workflows/checks.yml`).
    deps:
      - task: compile-cli

  compile-cli:
    desc: Скомпилировать cmd/cli во временную директорию.
    cmds:
      - go build -o "$(mktemp -d)/" ./cmd/cli
