version: '3'

# Корневой Taskfile репозитория. Делится на две части:
#   1. repo-checks — линтеры «ничьей земли» (файлы, не принадлежащие ни одному
#      модулю): .github/workflows/, корневой README.md, .claude/**, корневые
#      конфиги. Бинарники — из корневого mise.toml.
#   2. Делегация в server/Taskfile.yml и web/Taskfile.yml через `includes`.
#      Задачи модулей зовутся `task server:<name>` и `task web:<name>`.
#
# Изоляция: каждый модуль (server, web) сам проверяет свои файлы своими
# бинарниками (см. server/Taskfile.yml и web/Taskfile.yml). Корневой
# Taskfile НЕ ходит в scope модулей — там это уже сделано.

includes:
  # `dir` обязателен: без него Go-инструменты внутри server (go-arch-lint, buf,
  # mockery) запускаются из корня репо и не находят свои конфиги.
  server:
    taskfile: ./server
    dir: ./server
  # web/ — Vite + React фронт. Команды зовутся как `task web:<name>` и
  # выполняются с cwd=web/, чтобы npm/buf видели свои конфиги.
  web:
    taskfile: ./web
    dir: ./web

tasks:
  checks:
    desc: Read-only проверки всего репо (server:checks + web:checks + repo-checks).
    deps:
      - task: server:checks
      - task: web:checks
      - task: repo-checks

  repo-checks:
    desc: Линтеры «ничьей земли» репозитория (workflows, корневой README, .claude/**).
    # Параллельный аналог `server:checks` / `web:checks` для не-модульного слоя.
    # Тот же набор зеркалит матрица `.github/workflows/repo-checks.yml`.
    deps:
      - task: lint-actionlint
      - task: lint-yamllint
      - task: lint-markdownlint
      - task: lint-prettier
      - task: lint-lychee
      - task: lint-cspell

  lint-actionlint:
    desc: actionlint — статический анализ GitHub Actions workflows (.github/workflows/*.yml).
    # actionlint сам находит .github/workflows/*.yml — glob не нужен.
    cmds:
      - actionlint

  lint-yamllint:
    desc: yamllint по YAML-файлам «ничьей земли».
    # `.yamllint.yml` уже игнорирует server/, web/, node_modules через `ignore:`.
    # Проходимся по корню; модульные YAML проверяют сами модули.
    cmds:
      - yamllint .

  lint-markdownlint:
    desc: markdownlint-cli2 — структура корневого README.md и .claude/**/*.md.
    # Scope — только «ничья земля». Модули проверяют свои .md сами.
    cmds:
      - markdownlint-cli2 "*.md" ".claude/**/*.md"

  lint-prettier:
    desc: prettier --check — оформление корневого README.md и .claude/**/*.md.
    cmds:
      - prettier --check "*.md" ".claude/**/*.md"

  lint-lychee:
    desc: lychee — проверка ссылок в Markdown «ничьей земли».
    # Список файлов берём через `git ls-files`: уважает .gitignore и
    # исключает scope модулей.
    cmds:
      - >-
          git ls-files --cached --others --exclude-standard '*.md' ':!server/**' ':!web/**'
          | xargs lychee --no-progress

  lint-cspell:
    desc: cspell — орфография ru/en в «ничьей земле».
    # ignorePaths в cspell.config.yaml исключает server/** и web/**.
    # NODE_PATH указывает на установку русского словаря через корневой mise.toml.
    env:
      NODE_PATH:
        sh: echo "$(mise where npm:@cspell/dict-ru_ru)/lib/node_modules"
    cmds:
      - cspell --no-progress --no-summary "**/*" "**/.*/**/*"

  fmt:
    desc: Запустить все formatters во всех модулях и в «ничьей земле».
    # Используем cmds (последовательно): fmt-markdownlint и fmt-prettier
    # работают по одним и тем же .md-файлам — сначала структура, потом
    # оформление поверх. server:fmt и web:fmt идут параллельно через свои
    # модули, не конфликтуют с корневыми .md.
    cmds:
      - task: server:fmt
      - task: web:fmt
      - task: fmt-markdownlint
      - task: fmt-prettier

  fmt-markdownlint:
    desc: markdownlint-cli2 --fix — автофиксы структуры Markdown в «ничьей земле».
    cmds:
      - markdownlint-cli2 --fix "*.md" ".claude/**/*.md" || true

  fmt-prettier:
    desc: prettier --write — автофикс оформления Markdown в «ничьей земле».
    cmds:
      - prettier --write "*.md" ".claude/**/*.md"

  run:
    desc: Запустить все модули проекта параллельно (server, web).
    # deps в go-task запускаются параллельно — server и web поднимаются
    # одновременно. web перенаправляет /company.v1.* на server :8080.
    deps:
      - task: server:run
      - task: web:run

  docker-build:
    desc: Собрать Docker-образы обоих сервисов (server + web) параллельно.
    deps:
      - task: server:docker-build
      - task: web:docker-build
