version: '3'

# Go-задачи модуля server. Запускаются из директории server/ — все пути
# и конфиги (.golangci.yml, .go-arch-lint.yml, .mockery.yaml,
# .testcoverage.yml, buf.yaml, buf.gen.yaml) относительны этому каталогу.
# Корневой Taskfile.yml подключает этот файл через `includes: server: ./server`,
# поэтому из корня задачи зовутся `task server:<name>`.

includes:
  # Общерепные переиспользуемые таски (см. taskfile-snippets.yml в корне).
  # `dir: .` означает: snippet-таски запускаются с cwd модуля server/,
  # а не из директории, где лежит сам snippets-файл.
  snippets:
    taskfile: ../taskfile-snippets.yml
    dir: .
    internal: true

tasks:
  checks:
    desc: Read-only проверки модуля server (lint + compile + test).
    deps:
      - task: lint
      - task: compile
      - task: test

  lint:
    desc: Запустить все Go-линтеры модуля параллельно.
    deps:
      - task: lint-golangci-lint
      - task: lint-structfielddocs
      - task: lint-arch
      - task: lint-govulncheck
      - task: lint-buf
      - task: lint-generated-proto
      - task: lint-generated-mocks

  lint-golangci-lint:
    desc: golangci-lint по всему Go-коду.
    cmds:
      - golangci-lint run ./...

  lint-structfielddocs:
    desc: Проектный анализатор — doc-комментарии у экспортируемых полей структур.
    # Исполняемый файл ставится через mise, версия зафиксирована в mise.toml.
    # Источник — go:github.com/DanilaKorobkov/go-checkers/cmd/structfielddocs.
    cmds:
      - structfielddocs ./...

  lint-arch:
    desc: go-arch-lint — проверка слоёной архитектуры (.go-arch-lint.yml).
    # Запрещает запрещённые стрелки между компонентами (domain → infra и т.п.).
    # Конфиг — .go-arch-lint.yml рядом с этим Taskfile; описывает границы слоёв,
    # исключения для composition root (app/, cmd/) и общие компоненты (gen/, mocks/).
    cmds:
      - go-arch-lint check

  lint-govulncheck:
    desc: govulncheck — проверка известных CVE в Go-зависимостях и stdlib.
    # Официальный сканер уязвимостей от команды Go (golang.org/x/vuln).
    # В отличие от audit-инструментов по списку модулей анализирует call graph
    # и репортит только реально достижимые из проекта уязвимости — меньше
    # шума. База — https://vuln.go.dev. Exit code != 0 при findings — CI падает.
    cmds:
      - govulncheck ./...

  lint-buf:
    desc: buf lint — стиль и обратная совместимость proto-схем.
    cmds:
      - buf lint

  lint-generated-proto:
    desc: Проверить, что gen/ в репозитории совпадает с buf generate.
    cmds:
      - task: snippets:diff-generated
        vars:
          # buf.gen.yaml уже задаёт `out: gen`; --output становится корнем,
          # поверх которого плагин дописывает свой `out`. Поэтому передаём
          # $OUTPUT_DIR, а не $OUTPUT_DIR/gen — иначе получим .../gen/gen.
          GEN_CMD: buf generate --output "$OUTPUT_DIR"
          REAL_DIR: gen

  lint-generated-mocks:
    desc: Проверить, что mocks/ в репозитории совпадают с mockery generate.
    # У mockery нет CLI-флага output-dir — подкладываем временный
    # .mockery.yaml с перезаписанным `dir:`, чтобы он писал в $OUTPUT_DIR.
    cmds:
      - task: snippets:diff-generated
        vars:
          GEN_CMD: |
            cfg="$OUTPUT_DIR/.mockery.yaml"
            sed "s|^dir: mocks/|dir: $OUTPUT_DIR/mocks/|" .mockery.yaml > "$cfg"
            mockery --config "$cfg"
          REAL_DIR: mocks

  test:
    desc: go test + go-test-coverage (пороги покрытия по слоям).
    # -covermode=atomic — единственный режим, корректный при `-race` и при
    # параллельных пакетах; -coverpkg=./... учитывает покрытие в пакетах,
    # которые тестируются опосредованно (например, domain покрывается тестами
    # на presentation). Без него go test пишет в профиль только пакеты, у
    # которых есть собственные _test.go-файлы — и слой с золотыми тестами
    # наверху не засчитывается слою с логикой внизу.
    #
    # Сразу за `go test` идёт go-test-coverage — порог покрытия из
    # .testcoverage.yml. Один task = один пробег тестов; cmds выполняются
    # последовательно, поэтому проверка порогов всегда читает свежий
    # coverage.out, без отдельной зависимой задачи.
    cmds:
      - go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - go-test-coverage --config=./.testcoverage.yml

  compile:
    desc: Проверить, что все binaries cmd/* компилируются. Каждый — отдельная задача, в параллель.
    deps:
      - task: compile-server

  compile-server:
    desc: Скомпилировать cmd/server во временную директорию.
    cmds:
      - go build -o "$(mktemp -d)/" ./cmd/server

  docker-build:
    desc: Собрать Docker-образ Connect-сервера (fa-server:dev) из Dockerfile.
    # cwd этой задачи — ./server (из includes.dir в корневом Taskfile),
    # поэтому контекст сборки — точка. Образ локальный, в registry не пушим.
    cmds:
      - docker build -t fa-server:dev .

  run:
    desc: >-
      Запустить Connect-сервер. Если порт уже занят — освободить и
      перезапустить.
    # cwd этой задачи — ./server (из includes.dir в корневом Taskfile).
    # .env лежит на корне репо, поэтому пути к нему — относительные (../.env).
    # preconditions останавливают задачу до cmds; .env обязателен, потому
    # что caarlos0/env с required без дефолтов упадёт с невнятной ошибкой.
    #
    # dotenv грузит переменные из ../.env в env процесса task, и они
    # наследуются `go run`. godotenv.Load() в app/config.go ищет ./.env
    # от cwd процесса (=server/) — не найдёт, вернёт ErrNotExist, что код
    # уже трактует как «файла нет, не ошибка» и использует уже выставленный env.
    preconditions:
      - sh: test -f ../.env
        msg: .env не найден — выполни `cp .env.example .env` в корне репо.
    dotenv:
      - ../.env
    # Порт читаем из самого .env, чтобы Taskfile не дублировал значение
    # SERVER_PORT и автоматически следовал за конфигом.
    vars:
      # `[ -f ../.env ] && grep ... || true` — глушим ошибку grep, если .env
      # нет: vars вычисляются раньше preconditions, и иначе пользователь
      # увидит "grep: ../.env: No such file or directory" поверх осмысленного
      # сообщения.
      PORT:
        sh: '[ -f ../.env ] && grep -E "^SERVER_PORT=" ../.env | cut -d= -f2 || true'
    cmds:
      # SIGKILL — обработчик процесса не успевает выполниться, ядро снимает
      # процесс и освобождает порт сразу при доставке сигнала. Это убирает
      # необходимость опрашивать порт в цикле. `xargs -I{}` корректно
      # обрабатывает пустой вход (когда порт свободен) — без -I `xargs`
      # на macOS вызвал бы `kill -9` без аргументов и упал. `/bin/kill` —
      # потому что встроенный shell go-task (mvdan/sh) не реализует builtin.
      - lsof -tiTCP:{{.PORT}} -sTCP:LISTEN 2>/dev/null | xargs -I{} /bin/kill -9 {}
      - go run ./cmd/server

  fmt:
    desc: Автофиксы Go-кода через golangci-lint --fix (ошибки игнорируем — их покажет lint).
    cmds:
      - golangci-lint run --fix ./... || true

  generate:
    desc: Сгенерировать весь автоматически создаваемый код параллельно (proto + mocks).
    deps:
      - task: generate-proto
      - task: generate-mocks

  generate-proto:
    desc: Сгенерировать Connect/gRPC-код из proto-схем (buf). Артефакты — в gen/.
    cmds:
      - buf generate

  generate-mocks:
    desc: Сгенерировать testify mocks по Go-интерфейсам (mockery). Артефакты — в mocks/.
    cmds:
      - mockery
