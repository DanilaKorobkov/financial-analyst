version: '3'

# Задачи модуля server. Запускаются из директории server/ — все пути
# и конфиги (.golangci.yml, .go-arch-lint.yml, .mockery.yaml,
# .testcoverage.yml, buf.yaml, buf.gen.yaml, cspell.config.yaml) относительны
# этому каталогу. Корневой Taskfile.yml подключает этот файл через
# `includes: server: ./server`, поэтому из корня задачи зовутся
# `task server:<name>`.
#
# Линт-задачи scope модуля (yamllint, markdownlint, prettier, lychee, cspell,
# hadolint) живут здесь, а не на корне: каждый модуль проверяет только свои файлы
# своими бинарниками из server/mise.toml. Общерепные конфиги-правила
# (.markdownlint-cli2.jsonc, .prettierrc.yaml, .yamllint.yml, lychee.toml)
# подхватываются по поиску вверх по дереву (markdownlint-cli2, prettier) либо
# передаются явно (-c, --config) — это даёт единый стиль на репо без
# дублирования правил.

includes:
  # Переиспользуемые snippets — лежат рядом, в server/, чтобы модуль не зависел
  # от корня (см. ../web/taskfile-snippets.yml — симметричная копия).
  snippets:
    taskfile: ./taskfile-snippets.yml
    dir: .
    internal: true

tasks:
  checks:
    desc: Read-only проверки модуля server (lint + compile + test).
    deps:
      - task: lint
      - task: compile
      - task: test

  lint:
    desc: Запустить все линтеры модуля параллельно.
    deps:
      - task: lint-golangci-lint
      - task: lint-structfielddocs
      - task: lint-arch
      - task: lint-govulncheck
      - task: lint-buf
      - task: lint-generated-proto
      - task: lint-generated-mocks
      - task: lint-yamllint
      - task: lint-markdownlint
      - task: lint-prettier
      - task: lint-lychee
      - task: lint-cspell
      - task: lint-hadolint

  lint-golangci-lint:
    desc: golangci-lint по всему Go-коду.
    cmds:
      - golangci-lint run ./...

  lint-structfielddocs:
    desc: Проектный анализатор — doc-комментарии у экспортируемых полей структур.
    cmds:
      - structfielddocs ./...

  lint-arch:
    desc: go-arch-lint — проверка слоёной архитектуры (.go-arch-lint.yml).
    cmds:
      - go-arch-lint check

  lint-govulncheck:
    desc: govulncheck — проверка известных CVE в Go-зависимостях и stdlib.
    cmds:
      - govulncheck ./...

  lint-buf:
    desc: buf lint — стиль и обратная совместимость proto-схем.
    cmds:
      - buf lint

  lint-generated-proto:
    desc: Проверить, что gen/ в репозитории совпадает с buf generate.
    cmds:
      - task: snippets:diff-generated
        vars:
          GEN_CMD: buf generate --output "$OUTPUT_DIR"
          REAL_DIR: gen

  lint-generated-mocks:
    desc: Проверить, что mocks/ в репозитории совпадают с mockery generate.
    cmds:
      - task: snippets:diff-generated
        vars:
          GEN_CMD: |
            cfg="$OUTPUT_DIR/.mockery.yaml"
            sed "s|^dir: mocks/|dir: $OUTPUT_DIR/mocks/|" .mockery.yaml > "$cfg"
            mockery --config "$cfg"
          REAL_DIR: mocks

  lint-yamllint:
    desc: yamllint по YAML-файлам модуля.
    cmds:
      - yamllint .

  lint-markdownlint:
    desc: markdownlint-cli2 — структура Markdown-файлов модуля.
    # Конфиг общерепной (.markdownlint-cli2.jsonc) подхватывается
    # автообходом вверх. Если .md-файлов в модуле нет — задача no-op.
    cmds:
      - >-
          files=$(git ls-files --cached --others --exclude-standard '*.md' '**/*.md');
          [ -z "$files" ] || echo "$files" | xargs markdownlint-cli2

  lint-prettier:
    desc: prettier --check — оформление Markdown-файлов модуля.
    # Конфиг общерепной (.prettierrc.yaml) подхватывается автообходом вверх.
    cmds:
      - >-
          files=$(git ls-files --cached --others --exclude-standard '*.md' '**/*.md');
          [ -z "$files" ] || echo "$files" | xargs prettier --check

  lint-lychee:
    desc: lychee — проверка ссылок в Markdown-файлах модуля.
    cmds:
      - >-
          files=$(git ls-files --cached --others --exclude-standard '*.md' '**/*.md');
          [ -z "$files" ] || echo "$files" | xargs lychee --config ../lychee.toml --no-progress

  lint-cspell:
    desc: cspell — орфография ru/en в scope модуля server.
    # NODE_PATH указывает на установку русского словаря через server/mise.toml.
    env:
      NODE_PATH:
        sh: echo "$(mise where npm:@cspell/dict-ru_ru)/lib/node_modules"
    cmds:
      - cspell --no-progress --no-summary --config cspell.config.yaml "**/*" "**/.*/**/*"

  lint-hadolint:
    desc: hadolint — best practices Docker + shellcheck в RUN для Dockerfile модуля.
    # Запуск через docker: у hadolint 2.12.0 нет darwin-arm64 бинарника.
    # Контекст — только server/Dockerfile (web/Dockerfile проверяет web:lint-hadolint).
    cmds:
      - >-
          docker run --rm -i
          -v "$PWD:/workspace:ro" -w /workspace
          ghcr.io/hadolint/hadolint:v2.12.0
          hadolint Dockerfile

  test:
    desc: go test + go-test-coverage (пороги покрытия по слоям).
    cmds:
      - go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - go-test-coverage --config=./.testcoverage.yml

  compile:
    desc: Проверить, что все binaries cmd/* компилируются.
    deps:
      - task: compile-server

  compile-server:
    desc: Скомпилировать cmd/server во временную директорию.
    cmds:
      - go build -o "$(mktemp -d)/" ./cmd/server

  docker-build:
    desc: Собрать Docker-образ Connect-сервера (fa-server:dev) из Dockerfile.
    cmds:
      - docker build -t fa-server:dev .

  run:
    desc: >-
      Запустить Connect-сервер. Если порт уже занят — освободить и
      перезапустить.
    # .env лежит рядом с модулем (server/.env). Конфиг читается только из
    # переменных окружения через caarlos0/env — без .env требуемые поля
    # упадут с невнятной ошибкой, поэтому preconditions останавливают
    # задачу до cmds.
    preconditions:
      - sh: test -f .env
        msg: .env не найден — выполни `cp .env.example .env` в server/.
    dotenv:
      - .env
    vars:
      PORT:
        sh: '[ -f .env ] && grep -E "^SERVER_PORT=" .env | cut -d= -f2 || true'
    cmds:
      - lsof -tiTCP:{{.PORT}} -sTCP:LISTEN 2>/dev/null | xargs -I{} /bin/kill -9 {}
      - go run ./cmd/server

  fmt:
    desc: Автофиксы кода модуля (Go + Markdown).
    cmds:
      - task: fmt-go
      - task: fmt-markdownlint
      - task: fmt-prettier

  fmt-go:
    desc: golangci-lint --fix — автофиксы Go-кода (ошибки игнорируем, их покажет lint).
    cmds:
      - golangci-lint run --fix ./... || true

  fmt-markdownlint:
    desc: markdownlint-cli2 --fix — автофиксы структуры Markdown-файлов модуля.
    cmds:
      - >-
          files=$(git ls-files --cached --others --exclude-standard '*.md' '**/*.md');
          [ -z "$files" ] || echo "$files" | xargs markdownlint-cli2 --fix || true

  fmt-prettier:
    desc: prettier --write — автофикс оформления Markdown-файлов модуля.
    cmds:
      - >-
          files=$(git ls-files --cached --others --exclude-standard '*.md' '**/*.md');
          [ -z "$files" ] || echo "$files" | xargs prettier --write

  generate:
    desc: Сгенерировать весь автоматически создаваемый код параллельно (proto + mocks).
    deps:
      - task: generate-proto
      - task: generate-mocks

  generate-proto:
    desc: Сгенерировать Connect/gRPC-код из proto-схем (buf). Артефакты — в gen/.
    cmds:
      - buf generate

  generate-mocks:
    desc: Сгенерировать testify mocks по Go-интерфейсам (mockery). Артефакты — в mocks/.
    cmds:
      - mockery
