// Финансовая отчётность эмитента за один период — элемент ряда секции
// reports агрегата Company.

syntax = "proto3";

package company.v1;

import "company/v1/enums.proto";
import "company/v1/stock_period.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/DanilaKorobkov/financial-analyst/gen/company/v1;companyv1";

// StockReport — публикация финансовой отчётности эмитента за один
// отчётный период в одном стандарте. Денежные значения даны в
// исходных единицах с множителем amount.
message StockReport {
  // Отчётный период публикации.
  StockPeriod period = 1;

  // Момент записи. Пример: "2026-05-05T13:23:02Z".
  google.protobuf.Timestamp changed_at = 2;

  // Валюта отчётности эмитента. Пример: "RUB".
  Currency currency = 3;

  // Множитель денежных значений (1, 1_000_000, ...). Пример: "1000000".
  int64 amount = 4;

  // Выручка. Пример: 4988300.
  double revenue = 5;

  // Себестоимость. Пример: 0 (для банков не публикуется).
  double cost_of_sales = 6;

  // Валовая прибыль. Пример: 0 (для банков не публикуется).
  double gross_profit = 7;

  // Коммерческие, общехозяйственные и административные расходы. Пример: 1278800.
  double sel_gen_adm_expenses = 8;

  // Операционная прибыль. Пример: 0 (для банков не публикуется).
  double operating_income = 9;

  // Прибыль до уплаты процентов и налога на прибыль (EBIT).
  // Пример: 0 (для банков не публикуется).
  double ebit = 10;

  // Прибыль до уплаты процентов, налога и амортизации (EBITDA).
  // Пример: 0 (для банков не публикуется).
  double ebitda = 11;

  // Скорректированная EBITDA. Пример: 0 (нет данных).
  double ebitda_adjusted = 12;

  // Чистая прибыль. Пример: 1777700.
  double earnings = 13;

  // Прибыль до налога на прибыль. Пример: 2344200.
  double earnings_wo_tax = 14;

  // Совокупный доход. Пример: 2023100.
  double earnings_comprehensive = 15;

  // Совокупный доход акционеров материнской компании. Пример: 2025300.
  double earnings_comprehensive_stock_holders = 16;

  // Чистая прибыль акционеров материнской компании. Пример: 1779900.
  double earnings_stock_holders = 17;

  // Чистая прибыль от продолжающейся деятельности. Пример: 0 (нет данных).
  double earnings_continuing_operations = 18;

  // Суммарные расходы. Пример: 0 (для банков не публикуется).
  double total_expenses = 19;

  // Прочие операционные доходы. Пример: 0 (для банков не публикуется).
  double other_operating_income = 20;

  // Амортизация и истощение. Пример: 0 (нет данных).
  double depr_depl_amort = 21;

  // Расходы на R&D. Пример: 0 (для банков не публикуется).
  double research_and_development = 22;

  // Funds From Operations (для REIT). Пример: 0 (нет данных).
  double ffo = 23;

  // Процентные доходы. Пример: 9625800.
  double interest_income = 24;

  // Процентные расходы. Пример: 5917900.
  double interest_expense = 25;

  // Чистый процентный доход. Пример: 3707900.
  double interest_net = 26;

  // Комиссионные доходы. Пример: 1228600.
  double commission_income = 27;

  // Комиссионные расходы. Пример: 393600.
  double commission_expense = 28;

  // Чистый комиссионный доход. Пример: 835000.
  double commission_net = 29;

  // Денежный поток от операционной деятельности (CFO). Пример: 1316500.
  double cfo = 30;

  // Денежный поток от инвестиционной деятельности (CFI). Пример: -624800.
  double cfi = 31;

  // Денежный поток от финансовой деятельности (CFF). Пример: -707700.
  double cff = 32;

  // Свободный денежный поток (FCF). Пример: 717100.
  double fcf = 33;

  // Скорректированный свободный денежный поток. Пример: 0 (нет данных).
  double fcf_adjusted = 34;

  // Чистое изменение денежных средств. Пример: -14800.
  double net_change_in_cash = 35;

  // Капитальные затраты. Пример: 599400.
  double capex = 36;

  // Приобретение основных средств. Пример: 0 (нет данных).
  double ppe_purchase = 37;

  // Приобретение нематериальных активов. Пример: 0 (нет данных).
  double intangibles_purchase = 38;

  // Выкуп собственных акций. Пример: 187000.
  double repurchase_of_stock = 39;

  // Привлечение долга. Пример: 0 (на YTM-периоде не публикуется).
  double issuance_of_debt = 40;

  // Погашение долга. Пример: 0 (на YTM-периоде не публикуется).
  double payments_of_debt = 41;

  // Чистое привлечение долга. Пример: 0 (на YTM-периоде не публикуется).
  double net_issuance_of_debt = 42;

  // Выплаченные дивиденды. Пример: 0 (на YTM-периоде не публикуется).
  double payments_for_dividends = 43;

  // Выплаченные проценты. Пример: 0 (на YTM-периоде не публикуется).
  double cash_paid_for_interest = 44;

  // Выплаченный налог на прибыль. Пример: 619600.
  double cash_paid_for_tax = 45;

  // Суммарные активы. Пример: 69034700.
  double total_assets = 46;

  // Оборотные активы. Пример: 0 (для банков не публикуется).
  double current_assets = 47;

  // Внеоборотные активы. Пример: 0 (для банков не публикуется).
  double long_term_assets = 48;

  // Денежные средства и эквиваленты. Пример: 2812300.
  double cash_and_equiv = 49;

  // Краткосрочные финансовые вложения. Пример: 0 (для банков не публикуется).
  double short_term_investments = 50;

  // Денежные средства, эквиваленты и краткосрочные вложения. Пример: 2812300.
  double cash_equiv_st_invesments = 51;

  // Торговая дебиторская задолженность. Пример: 49094000.
  double accounts_receivable = 52;

  // Прочая дебиторская задолженность. Пример: 1730000.
  double other_receivable = 53;

  // Суммарная дебиторская задолженность. Пример: 50824000.
  double total_receivable = 54;

  // Запасы. Пример: 0 (для банков не публикуется).
  double inventories = 55;

  // Основные средства. Пример: 1374000.
  double property_plant_equipment = 56;

  // Основные средства, включая активы в форме права пользования. Пример: 1374000.
  double ppe_rou = 57;

  // Активы в форме права пользования. Пример: 0 (нет данных).
  double right_of_use_assets = 58;

  // Нематериальные активы. Пример: 692000.
  double intangible_assets = 59;

  // Гудвилл. Пример: 0 (нет данных).
  double goodwill = 60;

  // Гудвилл и нематериальные активы. Пример: 692000.
  double goodwill_intangible_assets = 61;

  // Нематериальные и материальные активы. Пример: 2066000.
  double intangible_and_tangible_assets = 62;

  // Долгосрочные финансовые вложения. Пример: 0 (для банков не публикуется).
  double long_term_investments = 63;

  // Суммарные обязательства. Пример: 60168600.
  double total_liabilities = 64;

  // Краткосрочные обязательства. Пример: 0 (для банков не публикуется).
  double current_liabilities = 65;

  // Долгосрочные обязательства. Пример: 0 (для банков не публикуется).
  double long_term_liabilities = 66;

  // Краткосрочный долг. Пример: 0 (на YTM-периоде не публикуется).
  double current_debt = 67;

  // Долгосрочный долг. Пример: 0 (на YTM-периоде не публикуется).
  double long_term_debt = 68;

  // Суммарный долг. Пример: 0 (на YTM-периоде не публикуется).
  double total_debt = 69;

  // Чистый долг. Пример: 0 (на YTM-периоде не публикуется).
  double net_debt = 70;

  // Скорректированный чистый долг. Пример: 0 (нет данных).
  double net_debt_adjusted = 71;

  // Текущая часть долгосрочного долга. Пример: 0 (нет данных).
  double cur_long_debt = 72;

  // Текущая часть долгосрочной аренды. Пример: 0 (нет данных).
  double cur_long_lease = 73;

  // Краткосрочные обязательства по аренде. Пример: 0 (нет данных).
  double current_lease = 74;

  // Долгосрочные обязательства по аренде. Пример: 0 (нет данных).
  double long_term_lease = 75;

  // Торговая кредиторская задолженность. Пример: 49846300.
  double accounts_payable = 76;

  // Прочая кредиторская задолженность. Пример: 4531100.
  double other_payable = 77;

  // Суммарная кредиторская задолженность. Пример: 54377400.
  double total_payable = 78;

  // Собственный капитал. Пример: 8866100.
  double equity = 79;

  // Собственный капитал акционеров материнской компании. Пример: 8871400.
  double equity_stock_holders = 80;

  // Нераспределённая прибыль. Пример: 8616300.
  double retained_earnings = 81;

  // Эмиссионный доход. Пример: 320300.
  double share_premium = 82;

  // Выкупленные собственные акции. Пример: -54900.
  double treasury_stock = 83;

  // Прибыль на акцию. Пример: 78.8021.
  double earnings_ps = 84;

  // Собственный капитал на акцию. Пример: 392.767.
  double equity_ps = 85;

  // Выручка на акцию. Пример: 220.849.
  double revenue_ps = 86;

  // EBITDA на акцию. Пример: 0 (для банков не публикуется).
  double ebitda_ps = 87;

  // Скорректированная EBITDA на акцию. Пример: 0 (нет данных).
  double ebitda_adjusted_ps = 88;

  // Свободный денежный поток на акцию. Пример: 31.7484.
  double fcf_ps = 89;

  // Скорректированный свободный денежный поток на акцию. Пример: 0 (нет данных).
  double fcf_adjusted_ps = 90;

  // Ссылка на исходный отчёт эмитента.
  // Пример: "https://financemarker.ru/cdn/?file_id=...sber_2026_3_q_msfo.pdf".
  string link = 91;

  // Ссылка на пресс-релиз.
  // Пример: "https://financemarker.ru/cdn/?file_id=...sber_2026_3_q_msfo_press.pdf".
  string link_press = 92;

  // Ссылка на обновление отчёта. Пример: "".
  string link_update = 93;

  // true для предварительной публикации. Пример: false.
  bool preliminary = 94;
}
