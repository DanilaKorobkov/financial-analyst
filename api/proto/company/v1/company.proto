// Схема Connect-сервиса CompanyService.
//
// Возвращает справочную карточку эмитента по тикеру: имя, ISIN,
// тип бумаги, уровень листинга. Дополнительно отдаёт карточку эмитента
// c классификацией (сектор / отрасль / страна / валюта), описанием и
// ссылками на корпоративный сайт и страницу раскрытия.

syntax = "proto3";

package company.v1;

option go_package = "github.com/DanilaKorobkov/financial-analyst/gen/company/v1;companyv1";

service CompanyService {
  rpc GetCompany(GetCompanyRequest) returns (GetCompanyResponse);
  rpc GetCompanyCard(GetCompanyCardRequest) returns (GetCompanyCardResponse);
}

message GetCompanyRequest {
  // Тикер бумаги (например, SBER, GAZP, LKOH).
  string ticker = 1;
}

message GetCompanyResponse {
  Company company = 1;
}

// SecurityType — тип бумаги. На первом шаге проекта enum покрывает
// только акции; остальные значения добавим по мере появления потребителей.
enum SecurityType {
  SECURITY_TYPE_UNSPECIFIED = 0;
  SECURITY_TYPE_COMMON_SHARE = 1;
  SECURITY_TYPE_PREFERRED_SHARE = 2;
  SECURITY_TYPE_DEPOSITARY_RECEIPT = 3;
}

// ListingLevel — котировальный уровень. UNSPECIFIED — уровень не указан.
enum ListingLevel {
  LISTING_LEVEL_UNSPECIFIED = 0;
  LISTING_LEVEL_FIRST = 1;
  LISTING_LEVEL_SECOND = 2;
  LISTING_LEVEL_THIRD = 3;
}

message Company {
  string ticker = 1;
  string isin = 2;
  string name = 3;
  SecurityType security_type = 4;
  ListingLevel listing_level = 5;
}

message GetCompanyCardRequest {
  // Тикер бумаги (например, SBER, GAZP, LKOH).
  string ticker = 1;
}

message GetCompanyCardResponse {
  CompanyCard card = 1;
}

// CompanyCard — карточка эмитента: идентификация и классификация
// (страна, валюта, сектор / отрасль), описание и ссылки.
message CompanyCard {
  string ticker = 1;
  string exchange = 2;
  string name = 3;
  string sector = 4;
  int32 sector_id = 5;
  string industry = 6;
  int32 industry_id = 7;
  string industry_group = 8;
  int32 industry_group_id = 9;
  string country = 10;
  string currency = 11;
  string primary_report_ticker = 12;
  string primary_report_exchange = 13;
  string description = 14;
  string site = 15;
  string disc_link = 16;
}
