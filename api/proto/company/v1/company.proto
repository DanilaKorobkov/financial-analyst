// Схема Connect-сервиса CompanyService.
//
// Возвращает по тикеру набор каноничных полей из каталога системы:
// какие именно — определяет сервер (сейчас — встроенная спецификация
// отчёта по эмитенту). Контракт намеренно динамический: список и состав
// полей меняются без изменения схемы транспорта.
//
// Каждое поле адресуется полным id вида `<provider>::<name>`
// (например, `moex::ticker`). Тип значения каждого поля выбирает
// одну ветку oneof в FieldValue. Доменные перечисления (тип бумаги,
// котировальный уровень, валюта, биржа, частота отчётности) передаются
// стабильным строковым кодом.

syntax = "proto3";

package company.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/DanilaKorobkov/financial-analyst/gen/company/v1;companyv1";

service CompanyService {
  rpc GetCompany(GetCompanyRequest) returns (GetCompanyResponse);
}

message GetCompanyRequest {
  // Тикер бумаги (например, SBER, GAZP, LKOH).
  string ticker = 1;
}

message GetCompanyResponse {
  // Карточка эмитента: поля, которые сервер собрал по запросу.
  // Ключ — полный id поля в каталоге (`<provider>::<name>`).
  // Отсутствие ключа означает, что поле не запрашивалось или источник
  // не вернул значения.
  map<string, FieldValue> fields = 1;
}

// FieldValue — значение одного поля. Конкретная ветка oneof выбирается
// по типу поля в каталоге: строки и доменные перечисления — в string_value
// (для перечислений — стабильный строковый код, см. каталог), целые —
// в int_value, булевы — в bool_value, даты — в timestamp_value.
message FieldValue {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    bool bool_value = 3;
    google.protobuf.Timestamp timestamp_value = 4;
  }
}
