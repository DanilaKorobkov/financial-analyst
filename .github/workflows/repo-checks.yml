name: repo-checks

# Общерепные linters: работают по всему репозиторию (Go-код, Markdown, YAML,
# GitHub Actions, ссылки, орфография). Не привязаны к конкретному модулю,
# поэтому запускаются без path-фильтра.
on:
  push:
    branches: [main]
  pull_request: {}

# Гасим устаревшие прогоны при быстрой череде коммитов в один и тот же PR
# или ветку.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Каждый target — отдельный параллельный job на своём runner.
    # В UI PR появляются как отдельные статусы
    # (`repo-checks / check (lint-cspell)` и т.п.).
    strategy:
      fail-fast: false
      matrix:
        target:
          - lint-yamllint
          - lint-markdownlint
          - lint-prettier
          - lint-lychee
          - lint-cspell
          - lint-actionlint
          # Линт Dockerfile-ов: запускается из Docker-образа hadolint,
          # daemon на ubuntu-latest уже есть из коробки — доп. setup не нужен.
          - lint-hadolint
          # Сборка Docker-образов модулей — на CI работают как отдельные
          # job'ы (server и web параллельно), это даёт чистые статусы в PR.
          - server:docker-build
          - web:docker-build
          # bootstrap/ — Ansible-каркас. Каждый target в матрице запускает
          # bootstrap:deps как dependency (ansible-galaxy install), поэтому
          # отдельного шага установки ролей в workflow не нужно.
          - bootstrap:lint
          - bootstrap:syntax-check
    name: check (${{ matrix.target }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mise ставит инструменты из mise.toml.
      # Версии — единая точка правды с локальной машиной разработчика.
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # Те же targets, что разработчик запускает локально через `task <target>`.
      - run: task ${{ matrix.target }}

  # Aggregate-«страж»: одна job со стабильным именем, зависящая от всей
  # матрицы. Именно её добавляем в required status checks ruleset для main.
  # Расширение матрицы не требует править ruleset — passed автоматически
  # ждёт всех новых children через `needs: [check]`.
  #
  # `if: always()` обязателен: без него job скипается при падении матрицы и
  # required check остаётся pending, блокируя merge.
  passed:
    name: repo-checks-passed
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # failure — хоть один target упал; cancelled — workflow отменён
      # (например, новым commit через concurrency); skipped — job не
      # запустился (например, выключен через `if:` в самой матрице). Любой из
      # трёх = «не всё зелёное» → стражу нужно упасть.
      - if: >-
          ${{ contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped') }}
        run: exit 1
