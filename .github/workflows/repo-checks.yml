name: repo-checks

# Линтеры «ничьей земли» репозитория: .github/workflows/*.yml,
# корневой README.md, .claude/**, корневые конфиги.
# Scope server/** и web/** проверяются собственными workflow
# (server-checks, web-checks) — здесь явно исключены.
#
# Бинарники — из корневого mise.toml (без Go-toolchain, buf, mockery).
on:
  push:
    branches: [main]
  pull_request: {}

# Гасим устаревшие прогоны при быстрой череде коммитов в один и тот же PR
# или ветку.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Каждый target — отдельный параллельный job на своём runner.
    # В UI PR появляются как `repo-checks / check (lint-cspell)` и т.п.
    strategy:
      fail-fast: false
      matrix:
        target:
          - lint-actionlint
          - lint-yamllint
          - lint-markdownlint
          - lint-prettier
          - lint-lychee
          - lint-cspell
    name: check (${{ matrix.target }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mise ставит инструменты из корневого mise.toml — node, python,
      # pipx-yamllint, npm-линтеры, lychee, actionlint.
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - run: task ${{ matrix.target }}

  # Aggregate-«страж»: одна job со стабильным именем, зависящая от всей
  # матрицы. Именно её добавляем в required status checks ruleset для main.
  passed:
    name: repo-checks-passed
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: >-
          ${{ contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped') }}
        run: exit 1
