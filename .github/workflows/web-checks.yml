name: web-checks

# Проверки модуля web: линтеры scope (yamllint, markdownlint, prettier,
# lychee, cspell, hadolint), контракт ↔ сгенерированный TS-клиент,
# docker-build. Все бинарники — из web/mise.toml.
#
# Запускается без path-фильтра: обязательный required-check
# `web-checks-passed` обязан появляться даже на PR, который не трогает
# web/ — иначе branch protection виснет в pending.
on:
  push:
    branches: [main]
  pull_request: {}

# Гасим устаревшие прогоны при быстрой череде коммитов в один и тот же PR
# или ветку.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        target:
          - lint-generated-proto
          - lint-yamllint
          - lint-markdownlint
          - lint-prettier
          - lint-lychee
          - lint-cspell
          - lint-hadolint
          - docker-build
    name: check (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Все `run:` шаги в этом job выполняются с cwd=web/.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # mise ставит инструменты из web/mise.toml — buf, node, task,
      # protoc-gen-es, линтеры. Дополнительный `npm ci` не нужен:
      # генерация TS-клиента не зависит от runtime-библиотек фронта.
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
          working_directory: web

      - run: task ${{ matrix.target }}

  # Aggregate-«страж»: одна job со стабильным именем, зависящая от всей
  # матрицы. Именно её добавляем в required status checks ruleset для main.
  passed:
    name: web-checks-passed
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: >-
          ${{ contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped') }}
        run: exit 1
