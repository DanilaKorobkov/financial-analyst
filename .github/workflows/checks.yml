name: checks

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  check:
    # Каждый target — отдельный параллельный job на своём runner.
    # В UI PR появляются как отдельные статусы (`check (lint-golang)` и т.п.),
    # видно, какой именно упал, без чтения общего лога.
    strategy:
      fail-fast: false
      matrix:
        # Каждый binary компилируется явно отдельным target `compile-<name>`.
        # При добавлении нового cmd/<name> расширяем этот список и одноимённую
        # задачу в `Taskfile.yml`.
        target:
          - lint-golangci-lint
          - lint-arch
          - lint-yamllint
          - lint-markdownlint
          - lint-prettier
          - lint-lychee
          - lint-cspell
          - lint-actionlint
          - lint-govulncheck
          - lint-buf
          - lint-generated-proto
          - lint-generated-mocks
          - lint-test-coverage
          - compile-server
          - test
    name: check (${{ matrix.target }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mise ставит инструменты из mise.toml.
      # Версии — единая точка правды с локальной машиной разработчика.
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # Те же targets, что разработчик запускает локально через `task checks`.
      - run: task ${{ matrix.target }}
