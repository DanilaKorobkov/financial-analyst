name: release

# Автоматический выпуск релизов через semantic-release.
#
# Зачем: получить полную автоматику цикла «merge → версия → образ».
# Каждый push в main с conventional-commit'ом feat/fix/refactor/perf/etc.
# превращается в git-тег vX.Y.Z и GitHub Release с заметками. Триггер
# для publish-images.yml (он реагирует на push: tags: ['v*']) приходит
# из этого тега. Релиз-PR'а нет — он не нужен, потому что плагины
# `@semantic-release/git` и `@semantic-release/changelog` НЕ подключены
# (см. .releaserc.json). Это значит:
#   * бот ничего не пушит обратно в main → bypass branch protection
#     не требуется;
#   * CHANGELOG.md в репо не существует, история релизов живёт только
#     в GitHub Releases.
#
# Почему GITHUB_TOKEN НЕ используется. По дизайну GitHub Actions
# события, созданные через штатный GITHUB_TOKEN, не запускают другие
# workflow'ы — это защита от циклов CI. Если бы semantic-release
# создавал тег v* через GITHUB_TOKEN, publish-images.yml не стартовал
# бы на push этого тега. Поэтому используется отдельный токен
# GitHub App: события от App-токена считаются «внешними» и нормально
# запускают последующие workflow'ы. App установлен на этом репо,
# имеет права Contents: Read and write. Секреты RELEASER_APP_ID и
# RELEASER_APP_PRIVATE_KEY заведены в Settings → Secrets → Actions.

on:
  push:
    branches: [main]

# Концепция параллелизма: cancel-in-progress: false. Если коммит N+1
# смерджен через минуту после N, второй прогон release.yml дождётся
# первого, чтобы у каждого был свой инкрементный тег (vX.Y.Z+1, а не
# конкурентная гонка за один и тот же номер).
concurrency:
  group: release
  cancel-in-progress: false

# Права workflow'а используются только для get-token шага (он сам
# по себе ничего не пишет в репо). Реальные операции записи делает
# App-токен из create-github-app-token; его права определяются
# установкой App, а не permissions этого workflow'а.
permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      # Меняем GITHUB_TOKEN на короткоживущий installation token
      # GitHub App. App установлен на этом репо с правом
      # Contents: Read and write; токен живёт ~1 час, дальше action
      # выпускает новый при следующем прогоне.
      - id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      # fetch-depth: 0 — semantic-release читает весь commit-log от
      # прошлого тега, иначе он не увидит коммитов и пропустит релиз.
      # token: App-токен — нужен, если semantic-release делает
      # git-операции (для push tags он использует GitHub API, но
      # checkout всё равно лучше делать тем же токеном, чтобы
      # не путать identities).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      # semantic-release — Node.js утилита. Версия Node — LTS-линейка,
      # совпадает с web/Dockerfile (нет смысла держать рассогласованные
      # версии в одном репозитории).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Готовый wrapper-action ставит semantic-release и плагины из
      # extra_plugins. conventional-changelog-conventionalcommits даёт
      # preset, на который ссылается .releaserc.json — без него
      # commit-analyzer и release-notes-generator упадут с
      # "Cannot find module 'conventional-changelog-conventionalcommits'".
      # Версия 8 совместима с release-notes-generator из v4 action;
      # 7 даёт TypeError в formatDate (устаревший dateformat API).
      - uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
