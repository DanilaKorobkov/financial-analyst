name: server-checks

# Проверки модуля server: Go-линтеры/компиляция/тесты + линтеры scope
# (yamllint, markdownlint, prettier, lychee, cspell, hadolint) +
# docker-build. Все бинарники — из server/mise.toml.
#
# Запускается без path-фильтра: обязательный required-check
# `server-checks-passed` обязан появляться даже на PR, который не трогает
# server/ — иначе branch protection виснет в pending.
on:
  push:
    branches: [main]
  pull_request: {}

# Гасим устаревшие прогоны при быстрой череде коммитов в один и тот же PR
# или ветку.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Каждый target — отдельный параллельный job на своём runner.
    # В UI PR появляются как `server-checks / check (lint-cspell)` и т.п.
    strategy:
      fail-fast: false
      matrix:
        # Каждый binary компилируется явно отдельным target `compile-<name>`.
        # При добавлении нового cmd/<name> расширяем этот список и
        # одноимённую задачу в server/Taskfile.yml.
        target:
          - lint-golangci-lint
          - lint-structfielddocs
          - lint-arch
          - lint-govulncheck
          - lint-buf
          - lint-generated-proto
          - lint-generated-mocks
          - lint-yamllint
          - lint-markdownlint
          - lint-prettier
          - lint-lychee
          - lint-cspell
          - lint-hadolint
          # `test` запускает `go test` и сразу за ним go-test-coverage
          # из server/Taskfile.yml — отдельная job для покрытия не нужна.
          - test
          - compile-server
          - docker-build
    name: check (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Все `run:` шаги в этом job выполняются с cwd=server/.
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      # mise ставит инструменты из server/mise.toml — версии совпадают с
      # локальной машиной разработчика. `working_directory: server` указывает
      # mise на нужный конфиг (по умолчанию JS-actions ходят из repo root).
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
          working_directory: server

      # Те же targets, что разработчик запускает локально через
      # `task <target>` из server/.
      - run: task ${{ matrix.target }}

  # Aggregate-«страж»: одна job со стабильным именем, зависящая от всей
  # матрицы. Именно её добавляем в required status checks ruleset для main.
  # Расширение матрицы не требует править ruleset — passed автоматически
  # ждёт всех новых children через `needs: [check]`.
  passed:
    name: server-checks-passed
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: >-
          ${{ contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped') }}
        run: exit 1
