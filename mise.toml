# Единая точка правды для версий инструментов проекта.
# Локально и в CI берутся отсюда — `mise install` в корне поднимает всё.
#
# Установка mise: https://mise.jdx.dev/getting-started.html
#   macOS:        brew install mise
#   Linux/macOS:  curl https://mise.run | sh
# После установки добавить shell-хук (см. ссылку выше) — иначе версии
# не будут автоматически переключаться при `cd` в проект.

[tools]

# Основной рантайм проекта — весь runtime-код на Go.
go = "1.26.3"

# Линтер Go-кода — единая точка правды по стилю и проверкам (.golangci.yml).
golangci-lint = "2.12.2"

# Task runner проекта (Taskfile.yml) — единый вход для lint/fmt/test.
task = "3.49.1"

# Нужен как backend для pipx-пакетов (yamllint и т.п.). Минимум 3.10.
python = "3.14"

# pipx нужен mise как backend для установки yamllint; mise тянет его через
# aqua-backend (github.com/pypa/pipx с GitHub Releases) — без системных зависимостей.
pipx = "latest"

# yamllint — де-факто стандарт линтинга YAML; ставится через pipx-backend mise.
"pipx:yamllint" = "1.38.0"

# Node нужен как backend для npm-пакетов (markdownlint-cli2, cspell).
# LTS-линейка — стабильность важнее свежести.
node = "22.11.0"

# markdownlint-cli2 — линтер структуры Markdown: заголовки, списки, code fences,
# таблицы. Конфиг — .markdownlint-cli2.jsonc в корне. Версии правил см.
# https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
"npm:markdownlint-cli2" = "0.14.0"

# cspell — code-aware spell-checker для всего репозитория (Go, MD, YAML, TOML и т.д.).
# Понимает синтаксис языков, разбивает camelCase, пропускает code fences/URL.
# Конфиг — cspell.config.yaml; проектный словарь — .cspell/project.txt.
"npm:cspell" = "8.14.4"

# Русский словарь для cspell (в bundle cspell его нет — только en_US/en_GB).
# Подключается через `import` в cspell.config.yaml; путь определяется через
# NODE_PATH, выставляемый задачей lint-spell в Taskfile.yml.
"npm:@cspell/dict-ru_ru" = "2.3.2"

# lychee — быстрый чекер ссылок в Markdown (внешние URL, локальные пути, якоря).
# Rust binary через aqua-backend mise (GitHub Releases). Конфиг — lychee.toml.
"aqua:lycheeverse/lychee" = "0.15.1"

# Prettier — де-факто стандарт форматирования Markdown в индустрии. Парный
# инструмент к markdownlint-cli2: markdownlint проверяет структуру, Prettier
# приводит оформление (выравнивание GFM-таблиц, нормализация пробелов и
# переносов) к единому виду. Конфиг — .prettierrc.yaml; список игнорируемых
# путей берётся из .gitignore автоматически (Prettier 3+).
"npm:prettier" = "3.3.3"

# actionlint — статический анализатор GitHub Actions workflows
# (.github/workflows/*.yml): синтаксис, валидность выражений ${{ }}, корректность
# runner labels, shell-команды внутри run (через shellcheck, если установлен),
# использование устаревших set-output и т.п. Конфиг по умолчанию — без
# дополнительного файла; при необходимости можно завести .github/actionlint.yaml.
"aqua:rhysd/actionlint" = "1.7.12"

# buf — CLI для protobuf-схем: линт, breaking-check, кодген.
"aqua:bufbuild/buf" = "1.69.0"

# protoc-плагины для buf generate. Ставятся через go-backend mise
# (собираются из исходников по pinned версии — единая сборка локально и в CI).
# Remote plugins на buf.build требуют авторизации с конца 2024, поэтому
# плагины подтянуты как локальные исполняемые файлы — это соответствует tooling.md
# (go-backend mise разрешён, как и для govulncheck).
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.6"
"go:connectrpc.com/connect/cmd/protoc-gen-connect-go" = "1.18.1"

# mockery — генератор mock-объектов по Go-интерфейсам (заменяет hand-rolled fakes).
"aqua:vektra/mockery" = "3.7.0"

# govulncheck — официальный сканер уязвимостей от команды Go
# (golang.org/x/vuln). В отличие от gosec (паттерны кода) проверяет реальные
# CVE в зависимостях и stdlib с учётом call graph: репортит только то, что
# фактически вызывается из проекта. База — https://vuln.go.dev. Ставится
# через go-backend mise — собирается из исходников по pinned версии, что
# гарантирует одинаковую сборку локально и в CI. Плагины protoc-gen-go и
# protoc-gen-connect-go выше — тот же подход.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.1.4"

# go-test-coverage — гейт по порогам покрытия тестами поверх `go test -coverprofile`.
# Парсит coverage.out, считает % покрытия по файлам / пакетам / total и сравнивает
# с порогами из .testcoverage.yml. Override-секция позволяет задавать разные пороги
# по слоям архитектуры (domain — 100%, presentation — 100%, infra — 80%; cmd
# исключается). Exit code != 0 при недоборе — CI падает.
# Документация: https://github.com/vladopajic/go-test-coverage
"go:github.com/vladopajic/go-test-coverage/v2" = "2.18.4"
