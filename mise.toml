# Версии инструментов «ничьей земли» репозитория — файлы, не принадлежащие
# ни одному модулю: .github/workflows/, корневой README.md, .claude/**,
# корневые конфиги (.markdownlint-cli2.jsonc, .prettierrc.yaml, lychee.toml,
# cspell.config.yaml, .yamllint.yml, mise.toml).
#
# Go-toolchain, buf, mockery и т.п. живут в server/mise.toml; node-стек фронта —
# в web/mise.toml. Здесь только то, чем чекаются файлы вне server/ и web/.
#
# Установка mise: https://mise.jdx.dev/getting-started.html

# Перебиваем GOCACHE / GOLANGCI_LINT_CACHE, которые приезжают из родительского
# mise.toml: worktree живёт внутри main-репозитория и mise по traversal тянет
# его конфиг. Без этой перебивки `task server:<name>` из корня worktree
# использует кэш main-репо, в котором лежат записи с путями main-репо —
# из-за чего из корня worktree линтер репортит «ошибки» в чужих файлах
# с путями вида `../../../../internal/...`.
# Для случая `cd server && task <name>` те же значения задаёт server/mise.toml
# [env] (там {{config_root}} = server/, путь получается тот же).
[env]
GOCACHE = "{{config_root}}/server/.gocache"
GOLANGCI_LINT_CACHE = "{{config_root}}/server/.golangci-cache"

[tools]

# Task runner — единый вход для repo-checks.
task = "3.49.1"

# Python + pipx нужны как backend для yamllint.
python = "3.14"
pipx = "latest"

# yamllint — линтер YAML-файлов «ничьей земли»: .github/workflows/*.yml,
# .yamllint.yml, cspell.config.yaml.
"pipx:yamllint" = "1.38.0"

# Node нужен как backend для npm-пакетов (markdownlint-cli2, cspell, prettier).
node = "22.11.0"

# markdownlint-cli2 — линтер структуры Markdown для корневого README.md
# и .claude/**/*.md. Конфиг — .markdownlint-cli2.jsonc.
"npm:markdownlint-cli2" = "0.14.0"

# cspell — орфография ru/en для «ничьей земли». Scope server/** и web/**
# вырезан в cspell.config.yaml через ignorePaths.
"npm:cspell" = "8.14.4"

# Русский словарь для cspell (в bundle cspell его нет).
"npm:@cspell/dict-ru_ru" = "2.3.2"

# lychee — чекер ссылок в Markdown. Конфиг — lychee.toml.
"aqua:lycheeverse/lychee" = "0.15.1"

# Prettier — оформление Markdown. Парный к markdownlint-cli2.
"npm:prettier" = "3.3.3"

# actionlint — статический анализатор GitHub Actions workflows.
# По смыслу repo-only: .github/ принадлежит репозиторию, не модулю.
"aqua:rhysd/actionlint" = "1.7.12"
