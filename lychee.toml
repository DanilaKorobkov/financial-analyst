# Конфиг lychee — чекер ссылок в Markdown.
# Документация: https://lychee.cli.rs/usage/config/
# Запуск: `lychee "**/*.md"` (из Taskfile.yml -> lint-links).

############################
# Поведение
############################

# Максимум одновременных HTTP-запросов. Больше = быстрее, но риск 429
# от того же хоста. 16 — разумный компромисс для домашнего канала.
max_concurrency = 16

# Сколько раз повторить запрос на временную ошибку (5xx, таймаут, reset).
# 2 повтора покрывают типичные сетевые сбои без сильного замедления.
max_retries = 2

# Пауза между retry (в секундах) — даёт серверу прийти в себя.
retry_wait_time = 2

# Таймаут одного запроса (секунды). 20с хватает даже медленным
# зарубежным эндпоинтам; короче = ложные срабатывания.
timeout = 20

############################
# Кеш
############################

# Кешируем результаты в .lycheecache между прогонами.
# Повторные `task lint-md` не долбят сеть повторно — мгновенный pass.
cache = true

# TTL кеша (секунды). 1 день: достаточно, чтобы pre-push был быстрым,
# но протухшие ссылки всё равно регулярно перепроверяются.
max_cache_age = "1d"

############################
# Какие коды считать успехом
############################

# 200 OK — норма.
# 429 Too Many Requests — rate-limit, не битая ссылка; не валим сборку.
# 403 — некоторые CDN (Cloudflare, hh.ru) блокируют HEAD от ботов;
#       признак "сайт жив", а не "ссылка мертва".
accept = ["200", "403", "429"]

############################
# Что не проверять
############################

# Пути, которые lychee вообще не должен открывать.
# `.git` ищется по подстроке — отсекает служебный каталог git на любом уровне.
exclude_path = [
    ".git",
]

# URL-паттерны, которые игнорируем (по regex).
exclude = [
    # localhost и приватные сети — не достучимся из CI, да и не нужно.
    '^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)',
    '^https?://[^/]*\.local',
    # example.com и подобные placeholders в шаблонах.
    '^https?://example\.(com|org|net)',
]

############################
# Что проверять
############################

# Проверяем все типы ссылок (http, https, file, mailto).
# В MD доках встречаются и относительные пути на соседние файлы.
include_verbatim = false

# Проверять якоря (#anchor) в локальных MD-файлах: типичный кейс протухания
# при переименовании заголовков в references/<endpoint>.md.
include_fragments = true
