version: 3
workdir: .

# deepScan = false — отключаем дорогостоящий «advanced»-режим go-arch-lint,
# который трекает аргументы вызовов и DI-инъекции через composition root и
# репортит, что infra «зависит» от services только потому, что объект из infra
# передаётся в конструктор services в app/. Нам нужна именно граница импортов
# на уровне пакетов, поэтому оставляем только базовый компонентный линтер
# и vendor-проверку.
allow:
  deepScan: false

# Архитектурные слои проекта и разрешённые стрелки зависимостей.
# Проверяется go-arch-lint (см. mise.toml). Цель — детерминированно
# гарантировать, что domain не знает об infra/presentation, presentation
# не знает о конкретных провайдерах, провайдеры в infra не знают друг о друге,
# а подпакеты одного провайдера переиспользуют только общий клиент этого
# же провайдера. composition root (app/, cmd/) — единственное место,
# которому разрешено собирать всё вместе.

components:
  # Domain: каждый агрегат — отдельный компонент. Внутри агрегата лежат
  # entity, value objects, порты (gateway-интерфейсы), доменные sentinel-
  # ошибки и enum-ы, специфичные для агрегата.
  domain-company:
    in: internal/domain/company
  # Доменный порт доступа к каноничным полям эмитента: Bundle, Registry,
  # FieldDescriptor. Не знает про конкретные источники и про агрегаты —
  # это «нижний» уровень domain, на который опираются все агрегаты.
  domain-data:
    in: internal/domain/data
  # Доменные сервисы. Знают агрегаты и доменные порты — никаких
  # HTTP/gRPC/провайдеров.
  domain-services:
    in: internal/domain/services

  # Адаптеры внешних источников данных. Каждый провайдер разбит на:
  #   - общий клиент (в корне папки провайдера) — resty, error-mapping;
  #   - подпакеты на каждый порт, переиспользующие этот клиент.
  # Подпакет одного провайдера не должен импортировать другой подпакет
  # или другой провайдер.
  infra-moex:
    in: internal/infra/moex
  # Общий HTTP-клиент MOEX ISS и провайдер-специфичная классификация
  # HTTP-ошибок. Не знает ни о bundles, ни о домене — самый низ MOEX-слоя.
  infra-moex-client:
    in: internal/infra/moex/client
  # Реализации data.Bundle для MOEX. Каждый bundle — отдельный подпакет
  # внутри `bundles/<имя_бандла>/`, в нём — сам Bundle, парсер, тесты и
  # testdata. Внутри bundle делает HTTP-вызов, разбирает ответ и
  # раскладывает значения по каноничным полям — отдельного gateway-слоя нет.
  infra-moex-bundles:
    in: internal/infra/moex/bundles/**
  infra-financemarker:
    in: internal/infra/financemarker
  # Общий HTTP-клиент FinanceMarker.
  infra-financemarker-client:
    in: internal/infra/financemarker/client
  # Реализации data.Bundle для FinanceMarker. Каждый bundle — отдельный
  # подпакет внутри `bundles/<имя_бандла>/`.
  infra-financemarker-bundles:
    in: internal/infra/financemarker/bundles/**
  # Файловый кеш-Proxy над data.Bundle. Generic поверх любого bundle:
  # сериализует FieldValues с учётом типов из FieldDescriptor каждого поля.
  infra-filecache-bundle:
    in: internal/infra/filecache/bundle
  # Реализации company.ProfileRepository — какие поля карточки нужны
  # для тикера. Сейчас единственный вариант — статический набор полей
  # на все тикеры.
  infra-companyprofile:
    in: internal/infra/companyprofile

  # Транспортный слой. Знает domain и сгенерированный proto-код (generated).
  presentation:
    in: internal/presentation/**

  # Сгенерированный buf'ом proto-код. За форму его импортов отвечает кодген,
  # поэтому внутрь не лезем, а снаружи разрешаем импортировать всем, кому надо
  # (см. commonComponents ниже).
  generated:
    in: gen/**

  # Моки от mockery. Используются только в тестах. Доступны всем через
  # commonComponents.
  mocks:
    in: mocks/**

  # Composition root приложения — собирает domain + infra + presentation
  # в работающий процесс. Единственный компонент, которому разрешено
  # знать обо всех остальных.
  app:
    in: app
  cmd:
    in: cmd/**

deps:
  domain-company:
    mayDependOn:
      - domain-data
    anyVendorDeps: true

  domain-data:
    mayDependOn:
      - domain-data
    anyVendorDeps: true

  domain-services:
    mayDependOn:
      - domain-company
      - domain-data
      - domain-services
    anyVendorDeps: true

  infra-moex:
    mayDependOn:
      - domain-data
      - infra-moex
      - infra-moex-bundles
      - infra-moex-client
    anyVendorDeps: true

  infra-moex-client:
    anyVendorDeps: true

  infra-moex-bundles:
    mayDependOn:
      - domain-company
      - domain-data
      - infra-moex-bundles
      - infra-moex-client
    anyVendorDeps: true

  infra-financemarker:
    mayDependOn:
      - domain-data
      - infra-filecache-bundle
      - infra-financemarker
      - infra-financemarker-bundles
      - infra-financemarker-client
    anyVendorDeps: true

  infra-financemarker-client:
    anyVendorDeps: true

  infra-financemarker-bundles:
    mayDependOn:
      - domain-company
      - domain-data
      - infra-financemarker-bundles
      - infra-financemarker-client
    anyVendorDeps: true

  infra-filecache-bundle:
    mayDependOn:
      - domain-company
      - domain-data
      - infra-filecache-bundle
    anyVendorDeps: true

  infra-companyprofile:
    mayDependOn:
      - domain-company
      - infra-companyprofile
    anyVendorDeps: true

  presentation:
    mayDependOn:
      - domain-company
      - domain-data
      - domain-services
      - presentation
    anyVendorDeps: true

  generated:
    anyVendorDeps: true

  mocks:
    mayDependOn:
      - domain-company
      - domain-data
      - domain-services
    anyVendorDeps: true

  app:
    mayDependOn:
      - app
      - domain-company
      - domain-data
      - domain-services
      - infra-moex
      - infra-moex-bundles
      - infra-financemarker
      - infra-financemarker-bundles
      - infra-companyprofile
      - presentation
    anyVendorDeps: true

  cmd:
    mayDependOn:
      - app
    anyVendorDeps: true

# generated и mocks — служебные компоненты, доступные всем без явного
# перечисления в mayDependOn (proto-код и моки нужны и тестам, и app).
commonComponents:
  - generated
  - mocks

commonVendors: []
