version: 3
workdir: .

# deepScan = false — отключаем дорогостоящий «advanced»-режим go-arch-lint,
# который трекает аргументы вызовов и DI-инъекции через composition root и
# репортит, что infra «зависит» от services только потому, что объект из infra
# передаётся в конструктор services в app/. Нам нужна именно граница импортов
# на уровне пакетов, поэтому оставляем только базовый компонентный линтер
# и vendor-проверку.
allow:
  deepScan: false

# Архитектурные слои проекта и разрешённые стрелки зависимостей.
# Проверяется go-arch-lint (см. mise.toml). Цель — детерминированно
# гарантировать, что domain не знает об infra/presentation, presentation
# не знает о конкретных провайдерах, провайдеры в infra не знают друг о друге,
# а подпакеты одного провайдера переиспользуют только общий клиент этого
# же провайдера. composition root (app/, cmd/) — единственное место,
# которому разрешено собирать всё вместе.

components:
  # Domain: агрегат «компания». Внутри лежит сам агрегат, его секции,
  # value objects (enum-ы), порты источников секций, порт репозитория и
  # доменные sentinel-ошибки.
  domain-company:
    in: internal/domain/aggregates/company
  # Доменные сервисы. Знают агрегаты — никаких HTTP/gRPC/провайдеров.
  domain-services:
    in: internal/domain/services

  # Infra-реализация company.Repository — оркестрирует источники секций
  # и собирает агрегат Company.
  infra-company:
    in: internal/infra/company

  # Адаптеры внешних источников данных. Каждый провайдер разбит на:
  #   - общий клиент (в корне папки провайдера) — resty, error-mapping;
  #   - подпакеты на каждый порт источника секции, переиспользующие клиент.
  # Подпакет одного провайдера не должен импортировать другой подпакет
  # или другой провайдер.
  infra-moex-client:
    in: internal/infra/moex/client
  # Реализации SecurityDescriptionSource (и других порт-источников MOEX).
  # Каждый источник — отдельный подпакет провайдера, в нём — сам Source,
  # парсер, тесты и testdata.
  infra-moex-sources:
    in: internal/infra/moex/securitydescription
  # Общий HTTP-клиент FinanceMarker.
  infra-financemarker-client:
    in: internal/infra/financemarker/client
  # Реализации StockInfoSource (и других порт-источников FinanceMarker).
  infra-financemarker-sources:
    in:
      - internal/infra/financemarker/stockinfo
      - internal/infra/financemarker/stocksummary
  # Generic файловый кеш над любым JSON-сериализуемым T.
  infra-cache-filecache:
    in: internal/infra/cache/filecache
  # Кеширующий http.RoundTripper.
  infra-cache-httpcache:
    in: internal/infra/cache/httpcache

  # Транспортный слой. Знает domain и сгенерированный proto-код (generated).
  presentation:
    in: internal/presentation/**

  # Сгенерированный buf'ом proto-код.
  generated:
    in: gen/**

  # Моки от mockery.
  mocks:
    in: mocks/**

  # Composition root приложения — собирает domain + infra + presentation
  # в работающий процесс.
  app:
    in: app
  cmd:
    in: cmd/**

deps:
  domain-company:
    anyVendorDeps: true

  domain-services:
    mayDependOn:
      - domain-company
      - domain-services
    anyVendorDeps: true

  infra-company:
    mayDependOn:
      - domain-company
      - infra-company
    anyVendorDeps: true

  infra-moex-client:
    anyVendorDeps: true

  infra-moex-sources:
    mayDependOn:
      - domain-company
      - infra-moex-sources
      - infra-moex-client
    anyVendorDeps: true

  infra-financemarker-client:
    mayDependOn:
      - infra-cache-filecache
      - infra-cache-httpcache
      - infra-financemarker-client
    anyVendorDeps: true

  infra-financemarker-sources:
    mayDependOn:
      - domain-company
      - infra-cache-httpcache
      - infra-financemarker-sources
      - infra-financemarker-client
    anyVendorDeps: true

  infra-cache-filecache:
    mayDependOn:
      - infra-cache-filecache
    anyVendorDeps: true

  infra-cache-httpcache:
    mayDependOn:
      - infra-cache-filecache
      - infra-cache-httpcache
    anyVendorDeps: true

  presentation:
    mayDependOn:
      - domain-company
      - domain-services
      - presentation
    anyVendorDeps: true

  generated:
    anyVendorDeps: true

  mocks:
    mayDependOn:
      - domain-company
      - domain-services
    anyVendorDeps: true

  app:
    mayDependOn:
      - app
      - domain-company
      - domain-services
      - infra-company
      - infra-moex-sources
      - infra-moex-client
      - infra-financemarker-sources
      - infra-financemarker-client
      - presentation
    anyVendorDeps: true

  cmd:
    mayDependOn:
      - app
    anyVendorDeps: true

# generated и mocks — служебные компоненты, доступные всем без явного
# перечисления в mayDependOn (proto-код и моки нужны и тестам, и app).
commonComponents:
  - generated
  - mocks

commonVendors: []
