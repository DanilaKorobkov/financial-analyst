version: 3
workdir: .

# deepScan = false — отключаем дорогостоящий «advanced»-режим go-arch-lint,
# который трекает аргументы вызовов и DI-инъекции через composition root и
# репортит, что infra «зависит» от services только потому, что объект из infra
# передаётся в конструктор services в app/. Нам нужна именно граница импортов
# на уровне пакетов, поэтому оставляем только базовый компонентный линтер
# и vendor-проверку.
allow:
  deepScan: false

# Архитектурные слои проекта и разрешённые стрелки зависимостей.
# Проверяется go-arch-lint (см. mise.toml). Цель — детерминированно
# гарантировать, что domain не знает об infra/presentation, presentation
# не знает о конкретных провайдерах, провайдеры в infra не знают друг о друге,
# а подпакеты одного провайдера переиспользуют только общий клиент этого
# же провайдера. composition root (app/, cmd/) — единственное место,
# которому разрешено собирать всё вместе.

components:
  # Domain: каждый агрегат — отдельный компонент. Внутри агрегата лежат
  # entity, port (интерфейс репозитория), доменные sentinel-ошибки и
  # enum-ы, специфичные для агрегата.
  domain-company:
    in: internal/domain/company
  domain-companycard:
    in: internal/domain/companycard
  # Доменные сервисы. Знают агрегаты — никаких HTTP/gRPC/провайдеров.
  domain-services:
    in: internal/domain/services

  # Адаптеры внешних источников данных. Каждый провайдер разбит на:
  #   - общий клиент (в корне папки провайдера) — resty, error-mapping;
  #   - подпакеты на каждый порт, переиспользующие этот клиент.
  # Подпакет одного провайдера не должен импортировать другой подпакет
  # или другой провайдер.
  infra-moex:
    in: internal/infra/moex
  infra-moex-company:
    in: internal/infra/moex/company
  infra-financemarker:
    in: internal/infra/financemarker
  infra-financemarker-companycard:
    in: internal/infra/financemarker/companycard
  # Файловый кеш-Proxy над портом карточек эмитентов. Знает только domain-
  # contract порта и сам себя; не зависит ни от одного конкретного провайдера.
  infra-filecache-companycard:
    in: internal/infra/filecache/companycard

  # Транспортный слой. Знает domain и сгенерированный proto-код (generated).
  presentation:
    in: internal/presentation/**

  # Сгенерированный buf'ом proto-код. За форму его импортов отвечает кодген,
  # поэтому внутрь не лезем, а снаружи разрешаем импортировать всем, кому надо
  # (см. commonComponents ниже).
  generated:
    in: gen/**

  # Моки от mockery. Используются только в тестах. Доступны всем через
  # commonComponents.
  mocks:
    in: mocks/**

  # Composition root приложения — собирает domain + infra + presentation
  # в работающий процесс. Единственный компонент, которому разрешено
  # знать обо всех остальных.
  app:
    in: app
  cmd:
    in: cmd/**

deps:
  domain-company:
    anyVendorDeps: true

  domain-companycard:
    anyVendorDeps: true

  domain-services:
    mayDependOn:
      - domain-company
      - domain-companycard
      - domain-services
    anyVendorDeps: true

  infra-moex:
    anyVendorDeps: true

  infra-moex-company:
    mayDependOn:
      - domain-company
      - infra-moex
      - infra-moex-company
    anyVendorDeps: true

  infra-financemarker:
    anyVendorDeps: true

  infra-financemarker-companycard:
    mayDependOn:
      - domain-companycard
      - infra-financemarker
      - infra-financemarker-companycard
    anyVendorDeps: true

  infra-filecache-companycard:
    mayDependOn:
      - domain-companycard
      - infra-filecache-companycard
    anyVendorDeps: true

  presentation:
    mayDependOn:
      - domain-company
      - domain-companycard
      - domain-services
      - presentation
    anyVendorDeps: true

  generated:
    anyVendorDeps: true

  mocks:
    mayDependOn:
      - domain-company
      - domain-companycard
      - domain-services
    anyVendorDeps: true

  app:
    mayDependOn:
      - domain-company
      - domain-companycard
      - domain-services
      - infra-moex
      - infra-moex-company
      - infra-financemarker
      - infra-financemarker-companycard
      - infra-filecache-companycard
      - presentation
    anyVendorDeps: true

  cmd:
    mayDependOn:
      - app
    anyVendorDeps: true

# generated и mocks — служебные компоненты, доступные всем без явного
# перечисления в mayDependOn (proto-код и моки нужны и тестам, и app).
commonComponents:
  - generated
  - mocks

commonVendors: []
