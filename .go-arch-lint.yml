version: 3
workdir: .

# deepScan = false — отключаем дорогостоящий «advanced»-режим go-arch-lint,
# который трекает аргументы вызовов и DI-инъекции через composition root и
# репортит, что infra «зависит» от services только потому, что объект из infra
# передаётся в конструктор services в app/. Нам нужна именно граница импортов
# на уровне пакетов, поэтому оставляем только базовый компонентный линтер
# и vendor-проверку.
allow:
  deepScan: false

# Архитектурные слои проекта и разрешённые стрелки зависимостей.
# Проверяется go-arch-lint (см. mise.toml). Цель — детерминированно
# гарантировать, что domain не знает об infra/presentation, presentation
# не знает о конкретных провайдерах, а провайдеры в infra не знают друг
# о друге. composition root (app/, cmd/) — единственное место, которому
# разрешено собирать всё вместе.

components:
  # Ядро домена. Сущности и порты (интерфейсы репозиториев) живут в entities.
  entities:
    in: internal/domain/entities
  # Доменные сервисы. Знают только entities — никаких HTTP/gRPC/провайдеров.
  services:
    in: internal/domain/services

  # Адаптеры внешних источников данных. Все провайдеры — один компонент,
  # потому что правила одинаковые: знают только domain entities и свои
  # vendor-пакеты. Запрет на «провайдер X импортирует провайдер Y» можно
  # будет добавить, когда это станет нужно (отдельные подкомпоненты).
  infra:
    in: internal/infra/**

  # Транспортный слой. Знает domain и сгенерированный proto-код (generated).
  presentation:
    in: internal/presentation/**

  # Сгенерированный buf'ом proto-код. За форму его импортов отвечает кодген,
  # поэтому внутрь не лезем, а снаружи разрешаем импортировать всем, кому надо
  # (см. commonComponents ниже).
  generated:
    in: gen/**

  # Моки от mockery. Используются только в тестах. Доступны всем через
  # commonComponents.
  mocks:
    in: mocks/**

  # Технические утилиты проекта (HTTP-клиенты, retry, observability). Слоя
  # не имеют, доступны через commonComponents любому пакету, кому нужны.
  # Имя — internal-pkg, чтобы не путать с конвенцией публичного `pkg/` на
  # корне проекта.
  internal-pkg:
    in: internal/pkg/**

  # Публичная техническая «библиотека» проекта: то, что в принципе можно
  # вынести наружу (отдельным модулем или копипастой) — например,
  # observability-обвязка, общие типы. Сейчас пуст, но компонент заведён
  # заранее, чтобы зафиксировать правило: pkg ни от чего внутреннего не
  # зависит (leaf), а импортировать его может любой слой.
  pkg:
    in: pkg/**

  # Composition root приложения — собирает domain + infra + presentation
  # в работающий процесс. Единственный компонент, которому разрешено
  # знать обо всех остальных.
  app:
    in: app
  cmd:
    in: cmd/**

deps:
  entities:
    mayDependOn:
      - entities
    anyVendorDeps: true

  services:
    mayDependOn:
      - entities
      - services
    anyVendorDeps: true

  infra:
    mayDependOn:
      - entities
      - infra
      - internal-pkg
    anyVendorDeps: true

  presentation:
    mayDependOn:
      - entities
      - services
      - presentation
      - internal-pkg
    anyVendorDeps: true

  generated:
    anyVendorDeps: true

  mocks:
    mayDependOn:
      - entities
      - services
    anyVendorDeps: true

  app:
    mayDependOn:
      - entities
      - services
      - infra
      - presentation
      - internal-pkg
    anyVendorDeps: true

  cmd:
    mayDependOn:
      - app
    anyVendorDeps: true

  # internal-pkg и pkg — leaf-компоненты: вверх по слоям не зависят. Это
  # делает их пригодными для импорта из любой части проекта без риска
  # циклов и без размывания границ. internal-pkg может пользоваться pkg
  # (как «внутренняя» обёртка над «публичной» библиотекой), но не наоборот.
  internal-pkg:
    mayDependOn:
      - internal-pkg
      - pkg
    anyVendorDeps: true

  pkg:
    mayDependOn:
      - pkg
    anyVendorDeps: true

# generated, mocks и pkg — служебные компоненты, доступные всем без явного
# перечисления в mayDependOn. generated и mocks — артефакты кодгенерации,
# нужные и тестам, и app; pkg — публичная leaf-библиотека, импортируемая
# любым слоем.
#
# internal-pkg НАМЕРЕННО НЕ в commonComponents: commonComponents даёт не
# только входящие импорты от всех, но и перекрёстную видимость между
# членами, а pkg (leaf) не должен видеть internal-pkg. Доступ к internal-pkg
# раздаётся явно через mayDependOn у конкретных слоёв.
commonComponents:
  - generated
  - mocks
  - pkg

commonVendors: []
