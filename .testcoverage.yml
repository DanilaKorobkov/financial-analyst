# Конфигурация go-test-coverage — гейта по порогам покрытия тестами.
# Документация: https://github.com/vladopajic/go-test-coverage
#
# Запускается задачей `task lint-test-coverage` поверх профиля coverage.out,
# который генерирует `task test`. Exit code != 0 при недоборе порога —
# падает локально и в CI.

# Путь к coverage profile (вывод `go test -coverprofile`).
profile: coverage.out

# Базовая планка — 80% по файлу, пакету и проекту в целом. Любой новый
# пакет автоматически проверяется на этот порог; чтобы понизить — нужно
# явно добавить override-правило ниже. Это форсит осознанное решение
# «согласен с планкой» при появлении нового слоя в проекте.
threshold:
  file: 80
  package: 80
  total: 80

# Override-правила применяются в порядке сверху вниз — первое совпадение
# выигрывает. Регулярки матчатся по пути пакета относительно модуля.
#
# `(^|/)<имя>($|/)` — слой может лежать как на верхнем уровне (`domain/...`),
# так и под `internal/` (`internal/domain/...`); конкретная раскладка ещё не
# зафиксирована, шаблон закрывает оба варианта.
override:
  # Бизнес-логика и расчёты fair value — цена ошибки максимальная,
  # код чистый и тестируемый, целимся в 100%.
  - path: (^|/)domain($|/)
    threshold: 100

  # Форматирование отчётов, CLI-вывод — тоже 100%: легко покрывается
  # golden-file тестами, регрессии видны сразу.
  - path: (^|/)presentation($|/)
    threshold: 100

# Из статистики исключаем то, что не имеет смысла покрывать тестами:
# точки входа binaries, сгенерированные моки и codegen-файлы.
exclude:
  paths:
    # Точки входа binaries — `main()`, разбор флагов, инициализация.
    - ^cmd/

    # Проектные утилиты разработки (анализаторы, plugin-обёртки).
    # Покрытие тут собирается локально соседним unit-тестом, гейт всего
    # репозитория к ним не применяется — со временем содержимое tools/
    # переедет в отдельный репозиторий со своими порогами покрытия.
    - ^tools/

    # Composition root — сборка приложения из частей (DI-граф, чтение конфига).
    # Логики нет, только wiring.
    - ^app/

    # Сгенерированный buf/protoc код (protoc-gen-go, protoc-gen-connect-go).
    # Файлы имеют разные суффиксы (`.pb.go`, `.connect.go`); проще исключить
    # весь каталог, чем поддерживать список расширений.
    - ^gen/

    # Сгенерированные mockery моки. По соглашению mockery v3 кладёт всё под
    # mocks/<полный_путь_до_пакета>/<интерфейс>.go без суффикса `_mock`.
    - ^mocks/
